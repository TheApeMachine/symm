# Engine infrastructure — manual review only; optimizer must not mutate this file.
system:
  log:
    level: info
  queue:
    ttl: 10ms
    buffer: 1024

story:
  measurements:
    buffer: 1024
  prediction:
    horizon: 60s
    alpha: 0.1

market:
  quote_currency: EUR
  anchor_symbol: BTC/EUR
  default_symbols:
    - BTC/EUR
  max_scan_symbols: 1024
  book_depth_levels: 10
  l3_enabled: true
  l3_depth: 10
  subscribe_pace: 50ms
  ws_reconnect_initial: 1s
  ws_reconnect_max: 2m
  ws_reconnect_multiplier: 2
  ws_ping_interval: 15s

trading:
  record:
    file: runs/capture.jsonl
  replay:
    file: runs/capture.jsonl
  audit:
    file: runs/audit.jsonl

signals:
  raw_dump_max_mb: 64
  raw_dump_backup_count: 3

ui:
  addr: 127.0.0.1:8765
  heartbeat_interval: 1s
