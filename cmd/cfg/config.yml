market:
  quote_currency: EUR
  anchor_symbol: ""
  default_symbols:
    - BTC/EUR
  max_scan_symbols: 0
  book_depth_levels: 10
  subscribe_pace: 50ms
  ws_reconnect_initial: 1s
  ws_reconnect_max: 2m
  ws_reconnect_multiplier: 2
  ws_ping_interval: 15s

trading:
  order_ack_timeout: 500ms
  max_quote_age: 5s
  max_spread_bps: 100
  max_slippage_bps: 50
  model: paper
  record:
    file: runs/capture.jsonl
  replay:
    file: runs/capture.jsonl
    # Derive 50–200ms latency from tape when unset; set explicitly to override.
    execution_latency_ms: 0
    execution_stress_enabled: true
  paper:
    wallet_eur: 200
    # Optimizer replay drag (percent per side). Limit entries use maker_fee_pct.
    taker_fee_pct: 0.26
    maker_fee_pct: 0.16
    slippage_bps: 5
    latency_profile: runs/network_latency.json

optimizer:
  tune:
    candidate_report: ""

signals:
  spoof_weighted_threshold: 0.5
  min_fill_to_cancel_ratio: 0.1
  hawkes_fit_cooldown: 5
  causal:
    contagion_break: 0.8
    condition_switch: 1000

ui:
  addr: 127.0.0.1:8765
  heartbeat_interval: 1s
