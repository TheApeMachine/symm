system:
  pprof:
    enabled: false
    addr: 127.0.0.1:6060
  log:
    level: debug
  websocket:
    channel:
      buffer: 8192

cognitive:
  persist_dir: ""
  tick_budget: 10ms

market:
  quote_currency: USD
  book_depth_levels: 25
  baseline_halflife: 30s
  manifold_max_symbols: 64
  l3_enabled: true
  l3_depth: 10
  # Lock-free MPMC ingress requires a power-of-two capacity. Producers apply
  # backpressure rather than discard authoritative order-level deltas.
  l3_ring_capacity: 8192
  # High-liquidity run: deeper L2 book and faster subscription pacing.
  subscribe_pace: 50ms
  subscribe_batch: 200
  book:
    depth: 10
  ohlc:
    # Kraken websocket v2 expresses candle intervals as whole minutes.
    interval: 1
  universe:
    # Bounded compute/subscription ceiling for the heavier trade/book/level3
    # tier; every eligible pair still gets lightweight ticker/OHLC observation.
    trading_tier_size: 40
  forecast:
    # Dimensionless RLS covariance prior and memory policy for the per-symbol,
    # next-L3-epoch mid-return learner. A factor of one retains all observations
    # without imposing one wall-clock decay scale on every market.
    rls:
      initial_variance: 1.0
      forgetting_factor: 1.0
  manifold:
    # Maximum chronological lifetime observations retained per admitted symbol.
    lifetime_capacity: 4096

ui:
  addr: 127.0.0.1:8765

trading:
  model: paper
  slots:
    normal: 2
    reserved: 2

signals:
  feed_ring_capacity: 8192
  # Zero derives bars/day from signals.fluid.integration_interval.
  volume_clock_bars_per_day: 0
  fluid:
    # Zero derives tick size and grid half-width from the live book.
    tick_size: 0
    grid_half_width: 0
    # Zero derives the cadence from idle_threshold / max_integration_steps.
    integration_interval: 0
    idle_threshold: 5s
    max_integration_steps: 50
