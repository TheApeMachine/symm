experimental:
  # Presentation and diagnostic experiments are opt-in and paper-only.
  enabled: false

runtime:
  workspace:
    buffer: 64

system:
  data_path: ~/.symm/data
  pprof:
    enabled: false
    addr: 127.0.0.1:6060
  log:
    level: info
  streaming:
    max_shards: 128
    lane_capacity: 4096
    max_workers: 0
    spin_limit: 64
    drain_limit: 256
  bus:
    # The thesis broadcast re-asserts itself on this interval while an epoch is
    # unfinished, so a module that missed or coalesced a wake-up is woken again
    # instead of leaving the epoch stalled with no stamp and no way to recover.
    # Lower costs idle broadcasts; higher lengthens the worst-case recovery.
    heartbeat: 250ms
  websocket:
    endpoints:
      public: "wss://ws.kraken.com/v2"
      private: "wss://ws-auth.kraken.com/v2"
      level3: "wss://ws-l3.kraken.com/v2"
      futures: "wss://futures.kraken.com/ws/v1"
    # How often a session sends its keepalive. A half-open connection — one
    # side gone without a close, as when a mobile link drops out of reception —
    # is invisible to a socket that only reads. The periodic write is what
    # exposes it: the unacknowledged retransmits eventually fail the socket.
    ping_interval: 20s
    channel:
      # Public book/trade/ticker ingress queues and UI fan-out. Undersizing
      # stalls the Kraken reader behind book decode and starves trades.
      # ponytail: fixed capacity is an intentional simplification with memory
      # and burst limits; telemetry-driven or adaptive sizing is the upgrade path.
      buffer: 4096

hindsight:
  capture:
    # Raw frames and their manifests share one ordered, non-dropping queue.
    # Producers only block if storage consumes this full bounded allowance.
    queue_depth: 8192
    # SQLite commits at most this many ordered records per transaction.
    batch_size: 256
  witness:
    # Phase transitions and actions are the bounded decision moments retained
    # for counterfactual evaluation. Overflow marks the run GAPPED.
    queue_depth: 4096
    flush_interval: 50ms

resonance:
  learning_rate: 0.01
  layers: 3

regulator:
  # Number of model-surprise observations retained for the dashboard only.
  # Predictive learning retains its own sufficient statistics separately.
  history_capacity: 256

cognitive:
  # Keep the DMT radix tree fully in process. Empty persist_dir / in_memory
  # skips the WAL so TrainSensorySequence and episodic commits do not hit disk.
  in_memory: true
  persist_dir: ~/.symm/cognitive
  # Rotate the cognitive store aside on boot so a bloated WAL cannot poison the
  # next run. No-op when in_memory is set.
  reset_on_boot: true

market:
  quote_currency: USD
  instrument:
    excluded:
      - USD 
      - EUR
      - GBP
      - AUD
      - CAD
      - CHF
      - JPY
      - NZD
      - USDT
      - USDC
      - DAI
      - PYUSD
      - FDUSD
      - TUSD
      - USDG
      - USDE
      - EURT
      - EURC
      - GUSD
      - BUSD
      - FRAX
      - LUSD
      - CUSD
      - USD0
      - USDS
      - RLUSD
      - UST
  book_depth_levels: 25
  baseline_halflife: 30s
  l3_enabled: true
  l3_depth: 10
  # Kraken's standard L3 subscription-rate budget. Depth determines the cost
  # per symbol, so websocket batches are derived from this value.
  l3_rate_limit: 200
  # Lock-free MPMC ingress requires a power-of-two capacity. Producers apply
  # backpressure rather than discard authoritative order-level deltas.
  # ponytail: fixed capacity is an intentional simplification with memory and
  # burst limits; telemetry-driven or adaptive sizing is the upgrade path.
  l3_ring_capacity: 8192
  # High-liquidity run: deeper L2 book and faster subscription pacing.
  subscribe:
    pace: 1s
    batch: 200
  book:
    depth: 10
  forecast:
    # Dimensionless RLS covariance prior and memory policy for the per-symbol,
    # next-L3-epoch mid-return learner. A factor of one retains all observations
    # without imposing one wall-clock decay scale on every market.
    rls:
      initial_variance: 1.0
      forgetting_factor: 1.0
  manifold:
    # Maximum chronological lifetime observations retained per admitted symbol.
    lifetime_capacity: 4096
    # Zero keeps the solver MaxDelta from physics/fluid DefaultConfig.
    integration_interval: 0

ui:
  addr: 127.0.0.1:8765
  webrtc:
    # Per-channel records retained for an attached manifold viewer. Reaching
    # this bound backpressures publication rather than dropping an unpainted state.
    client_queue_frames: 4
    # SCTP buffered-amount high-water expressed in RFC 8831 16 KiB segments.
    # Flow control waits for capacity before enqueueing the next segment.
    buffered_segments: 64
  websocket:
    # Upper bound for one ordered dashboard batch. Later frames remain queued
    # for the next message; no telemetry record is truncated or discarded.
    max_message_bytes: 4194304

trading:
  model: paper
  persistence:
    # Stoploss checkpoints and trade-journal updates leave guardian threads
    # through this ordered, non-dropping queue.
    queue_depth: 1024
    batch_size: 128
  allocation:
    # Hard per-entry quote-notional ceiling. Every qualifying symbol is priced
    # independently; there is no position-slot or winner arbitration policy.
    max_fraction: 0.50

learning:
  # How many past impulse states a decision is conditioned on. The past is
  # bounded on purpose: a context carrying the whole run is unique to the
  # moment it was built, so it trains a path nothing ever revisits while the
  # cost of binding and recalling it grows with uptime.
  precursor_frames: 8
  # The longest window an outcome may still be attributed to the decision that
  # opened it. The window itself is not configured: it is derived per
  # instrument as the time that instrument's own movement needs to cover the
  # round trip the decision paid. This is only the ceiling on that derivation.
  # An instrument that needs longer than this to cover its own friction is
  # telling you it cannot be traded profitably at this size.
  maximum_horizon: 10m
  # How much of what the agent conditioned on is kept, so a move the tape
  # confirms later can be trained against the state that actually preceded it.
  # Grid regions are read from running estimators and cannot be recomputed at a
  # past coordinate, so this memory is the only way back to it.
  retained_contexts: 4096
  # The weight carried by evidence learned from a confirmed move rather than
  # from a decision the agent itself made and lived through. Below one on
  # purpose: the move is real, but the agent did not act on it.
  episode_authority: 0.5
  # How far back the boot-time warmup reads. Discovery walks the captured tape,
  # so an unbounded walk at startup would compete with the capture writer on
  # the same database it is still writing to.
  warmup_runs: 3
  warmup_contexts: 250000

cognition:
  # A binary confidence of 0.5 is exactly indifferent. Cognition must exceed
  # it before replacing its current named state.
  minimum_switch_confidence: 0.5

signals:
  depthflow:
    sampleSize: 128
  pumpdump:
    baselineCapacity: 128

manifold:
  grid:
    x: 64
    y: 64
    z: 64
  phase:
    lattice:
      width: 256
