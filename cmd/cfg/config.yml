system:
  log:
    level: debug
  audit:
    enabled: true
    file: runs/audit.jsonl
  queue:
    ttl: 1024
    buffer: 65536
  qpool:
    scheduling_timeout: 1s
    regulators:
      circuit_breaker:
        max_failures: 10
        reset_timeout: 10s
        max_half_open: 10
      rate_limiter:
        max_requests: 100
        interval: 1s
      back_pressure:
        max_queue_size: 1000
        interval: 1s
        timeout: 1s
      resource_governor:
        max_cpu_percent: 90
        max_memory_percent: 90
        interval: 1s

telemetry:
  gauge:
    readings_capacity: 1024
    publish_interval: 100ms

story:
  measurements:
    buffer: 1024
  prediction:
    horizon: 60s
    interval: 1s
    alpha: 0.1
    rls_initial_variance: 1000.0

market:
  quote_currency: USD
  anchor_symbol: BTC/USD
  default_symbols:
    - BTC/USD
  max_scan_symbols: 1024
  book_depth_levels: 10
  futures_enabled: false
  futures_ws_ping_interval: 30s
  l3_enabled: false
  l3_depth: 10
  # Fluid book resync still batches unsub/subscribe to avoid close 1008.
  subscribe_pace: 50ms
  subscribe_batch: 100
  ws_reconnect_initial: 1s
  ws_reconnect_max: 2m
  ws_reconnect_multiplier: 2
  ws_ping_interval: 15s
  story:
    measurement_max_age: 30s
    ui_interval: 1s
  book:
    checksum:
      levels: 10

ui:
  addr: 127.0.0.1:8765
  heartbeat_interval: 1s
  outbound_buffer: 512

trading:
  order_ack_timeout: 500ms
  max_quote_age: 15s
  model: paper
  margin_enabled: false
  replay:
    execution_latency_ms: 100
    execution_stress_enabled: true
    min_depth_coverage: 1.0
    depth_shortfall_stress: 8
    none_size_scale: 1.0
    dead_size_scale: 1.0
    trending_size_scale: 1.0
    bullish_size_scale: 1.0
    choppy_size_scale: 0.5
    bearish_size_scale: 0.35
  max_concurrent_positions: 4
  entry:
    batch_window: 50ms
    preemption_enabled: true
    transit_ttl: 5s
    opportunity_slot_count: 2
    confidence_baseline: 0.55
    turbulence_confidence_scale: 0.30
    surprise_baseline: 1.0
    turbulence_surprise_scale: 0.25
  paper:
    deterministic: true
    wallet: # No, these are not a mistake, or practice amount, but the exact amount I found in my Kraken account.
      usd: 200 # As such, it will be the only amount I am willing to trade with.
      eur: 200 # It is also the reason why this system has to be somewhat more advanced than a simple trading bot.
    slippage_bps: 5
    latency_profile: runs/network_latency.json
    failure_injection:
      enabled: false
      seed: 1
      connect_failure_rate: 0.0
      disconnect_rate: 0.0
  exit:
    confidence_baseline: 0.50
    confidence_floor: 0.35
    stop_floor: 0.012
    trail_tight: 0.01
    trail_wide: 0.03
    trail_revert: 0.015
    trail_default: 0.015
    spread_scale: 0.5
  audit:
    file: runs/audit.jsonl
    gate_cooldown: 60s
    max_mb: 32
    max_backups: 3
  record:
    file: ""

live:
  confirm: ""
  api_key_permissions_confirmed: false
  clock_synchronized: false
  exchange_connectivity_confirmed: false
  paper_live_parity_passed: false
  max_order_notional: 0
  max_daily_loss: 0

regime:
  window: 256
  min_samples: 16
  baseline:
    alpha_min: 0.01
    alpha_max: 0.25
    min_obs: 16
    trend_sigma: 1.25
    strong_trend_sigma: 2.5
    vol_floor_sigma: 3.0
    vol_scale_floor: 0.000001
    seed_vol_scale: 0.01

signals:
  trade_match_window: 60s
  score_inertia:
    effort: 16
  cross_section:
    return_capacity: 64
    min_bars: 8
    breadth_history_capacity: 64
  volume_clock_bars_per_day: 288
  spoof_weighted_threshold: 0.5
  min_fill_to_cancel_ratio: 0.1
  hawkes_fit_cooldown: 5
  raw_dump: true
  diagnostics:
    dead_dispersion: 0.0001
    flicker_crossing: 0.40
    flicker_autocorr: 0.20
    smooth_autocorr: 0.50
    flat_excursion_ratio: 1.05
    unstable_switch_rate: 0.50
  causal:
    surprise_threshold: 2.0
    alpha: 0.5
    publish_interval: 1s
    contagion_break: 0.8
    condition_switch: 1000
    contagion_window_slow_max: 128
    contagion_window_slow_min: 16
    contagion_window_vol_floor: 0.000001
    contagion_adaptive_sigma: 2
    contagion_volatility_reset_sigma: 5
  prediction:
  pumpdump:
    raw_dump: true
    window: 1m
    volume:
      epsilon: 0.000001
    measurements:
      capacity: 64
    surprise:
      matrix:
        order: 5
        alpha: 0.5
      threshold: 2.0
      weights:
        threshold: 0.5
    alpha: 0.5
  exhaust:
    raw_dump: true
    history_capacity: 24
    surprise_threshold: 2.0
    alpha: 0.5
  cvd:
    raw_dump: true
    surprise_threshold: 2.0
    alpha: 0.5
  depthflow:
    raw_dump: true
    surprise_threshold: 2.0
    alpha: 0.5
  hawkes:
    surprise_threshold: 2.0
    alpha: 0.5
  fluid:
    surprise_threshold: 2.0
    alpha: 0.5
    tick_size: 0.01
    grid_half_width: 100
    integration_interval: 100ms
  leadlag:
    raw_dump: true
    surprise_threshold: 2.0
    alpha: 0.5
    publish_interval: 200ms
  liquidity:
    raw_dump: true
    surprise_threshold: 2.0
    alpha: 0.5
  sentiment:
    raw_dump: true
    breadth_history_capacity: 64
    surge_threshold: 2.0
    alpha: 0.5
  correlation:
    raw_dump: true
    surprise_threshold: 2.0
    alpha: 0.5
  manifold:
    surprise_threshold: 2.0
    alpha: 0.5
    tick_size: 0.01
    grid_half_width: 32
    grid_x: 32
    grid_y: 3
    grid_z: 16
    max_modes: 128
    integration_interval: 100ms
    snapshot_interval: 500ms
  toxicity:
    surprise_threshold: 2.0
    alpha: 0.5
