system:
  data_path: ~/.symm/data
  audit:
    # Rename runtime-audit.jsonl aside on boot so diagnostics start clean.
    rotate_on_boot: true
  pprof:
    enabled: false
    addr: 127.0.0.1:6060
  log:
    level: debug
  websocket:
    channel:
      # Public book/trade/ticker ingress queues and UI fan-out. Undersizing
      # stalls the Kraken reader behind book decode and starves trades.
      buffer: 4096

cognitive:
  persist_dir: ~/.symm/cognitive
  tick_budget: 10ms
  # Rotate the cognitive store aside on boot so a bloated WAL cannot poison the
  # next run. Discards persisted Thesis recovery from that directory.
  reset_on_boot: true

market:
  quote_currency: USD
  book_depth_levels: 25
  baseline_halflife: 30s
  manifold_max_symbols: 64
  l3_enabled: true
  l3_depth: 10
  # Kraken's standard L3 subscription-rate budget. Depth determines the cost
  # per symbol, so websocket batches are derived from this value.
  l3_rate_limit: 200
  # Lock-free MPMC ingress requires a power-of-two capacity. Producers apply
  # backpressure rather than discard authoritative order-level deltas.
  l3_ring_capacity: 8192
  # High-liquidity run: deeper L2 book and faster subscription pacing.
  subscribe_pace: 20ms
  subscribe_batch: 200
  book:
    depth: 10
  forecast:
    # Dimensionless RLS covariance prior and memory policy for the per-symbol,
    # next-L3-epoch mid-return learner. A factor of one retains all observations
    # without imposing one wall-clock decay scale on every market.
    rls:
      initial_variance: 1.0
      forgetting_factor: 1.0
  manifold:
    # Maximum chronological lifetime observations retained per admitted symbol.
    lifetime_capacity: 4096

ui:
  addr: 127.0.0.1:8765

trading:
  model: paper
  slots:
    normal: 2
    reserved: 2

signals:
  # The central public stream retains this event window. Older events are
  # overwritten by design; enlarge the configured ring if one measurement cut
  # must inspect a larger live burst.
  feed_timeline_capacity: 4096
  # Preserve the existing per-symbol history allowance independently from the
  # global burst journal; multiplying the timeline size by every symbol would
  # make memory scale with the square of the observed market surface.
  feed_track_capacity: 512
  # Zero derives bars/day from signals.fluid.integration_interval.
  volume_clock_bars_per_day: 0
  fluid:
    # Zero derives tick size and grid half-width from the live book.
    tick_size: 0
    grid_half_width: 0
    # Zero derives the cadence from idle_threshold / max_integration_steps.
    integration_interval: 0
    idle_threshold: 5s
    max_integration_steps: 50
