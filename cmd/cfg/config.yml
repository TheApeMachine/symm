market:
  quote_currency: EUR
  anchor_symbol: ""
  default_symbols:
    - BTC/EUR
  max_scan_symbols: 0
  book_depth_levels: 10

trading:
  order_ack_timeout: 500ms
  model: paper
  record:
    file: runs/capture.jsonl
  replay:
    file: runs/capture.jsonl
  paper:
    wallet_eur: 200

optimizer:
  tune:
    candidate_report: ""

signals:
  spoof_weighted_threshold: 0.5
  min_fill_to_cancel_ratio: 0.1
  hawkes_fit_cooldown: 5
  causal:
    contagion_break: 0.8
    condition_switch: 1000

ui:
  addr: 127.0.0.1:8765
  heartbeat_interval: 1s
