market:
  quote_currency: EUR
  anchor_symbol: ""
  default_symbols:
    - BTC/EUR
  max_scan_symbols: 64
  book_depth_levels: 10
  subscribe_pace: 50ms
  ws_reconnect_initial: 1s
  ws_reconnect_max: 2m
  ws_reconnect_multiplier: 2
  ws_ping_interval: 15s

trading:
  order_ack_timeout: 500ms
  max_quote_age: 5s
  max_spread_bps: 100
  max_slippage_bps: 50
  model: paper
  record:
    file: runs/capture.jsonl
  replay:
    file: runs/capture.jsonl
    # Derive 50–200ms latency from tape when unset; set explicitly to override.
    execution_latency_ms: 0
    execution_stress_enabled: true
  # Fraction of available account cash deployed per entry. 1.0 = full deployment
  # (one position at a time on a small wallet); lower allows concurrent positions.
  # The optimizer replay sizes entries the same way, so funding contention is real.
  position_fraction: 1.0
  paper:
    wallet_eur: 200
    # Optimizer replay drag (percent per side). Limit entries use maker_fee_pct.
    taker_fee_pct: 0.26
    maker_fee_pct: 0.16
    slippage_bps: 5
    latency_profile: runs/network_latency.json
  # Protective-exit trigger offsets (percent). A long exits when price falls
  # stop_loss_pct below entry, rises take_profit_pct above entry, or falls
  # trailing_volatility_multiple realized-volatility units below its peak since
  # entry. Explicit playbook offsets override the dynamic trailing distance.
  exit:
    stop_loss_pct: 2.0
    take_profit_pct: 3.0
    trailing_volatility_multiple: 3.0
  audit:
    file: runs/audit.jsonl

optimizer:
  search:
    # Explore "in regime X do Y" branches. When off, the regime axis collapses to
    # RegimeNone (legacy behaviour) and the MCTS move set shrinks ~6x.
    regime_aware: true
  tune:
    candidate_report: ""

# Price-action regime classification (market/perspectives.ClassifyRegime).
# Computed identically on the live and replay paths from the recent distinct-price
# path, so a regime edge the optimizer discovers reproduces when traded live.
regime:
  window: 256          # most-recent measurements to classify over
  min_samples: 16      # price-bearing measurements required before a regime is claimed
  dead_vol: 0.0005     # realized-vol floor; below it a non-trending market reads as Dead
  trend_threshold: 1.5 # trend t-stat for RegimeTrending
  strong_trend: 3.0    # trend t-stat for signed RegimeBullish / RegimeBearish
  vol_scale: 0.01      # dashboard radar volatility full-scale normalization

signals:
  spoof_weighted_threshold: 0.5
  min_fill_to_cancel_ratio: 0.1
  hawkes_fit_cooldown: 5
  causal:
    contagion_break: 0.8
    condition_switch: 1000
    raw_dump: false

  # Raw diagnostic dumps. When enabled, a signal writes its richest
  # pre-classification record to <dir>/<name>_raw.jsonl, which the Signal Insight
  # page (and `go test ./analyze`) reads to certify the signal behaves sensibly.
  # These files grow fast — a deliberate diagnostic mode. `raw_dump` here is the
  # default for any signal that does not set its own; a per-signal raw_dump below
  # wins in BOTH directions (false silences a signal even when this is true). As
  # shipped every signal sets false, so nothing dumps until you flip one on.
  raw_dump: true            # default for signals with no per-signal override
  raw_dump_max_mb: 64       # rotate each dump after this many megabytes
  raw_dump_backup_count: 3  # how many rotated files to keep (<name>_raw.jsonl.1 ...)
  # raw_dump_dir: runs      # directory for dumps; the writer and Signal Insight share it
  # raw_dump_max_bytes: 0   # exact rotation size in bytes; overrides raw_dump_max_mb when > 0
  # Per signal you may also set signals.<name>.raw_dump_file to redirect its dump.

  # Online self-calibration: pumpdump and correlation pool every symbol into one
  # shared BandCalibrator that retunes their classifier band edges to the live
  # distribution each tick (no offline step). Other signals do not self-calibrate.
  # The dumps + Signal Insight page are how you observe it working.

  # Per-signal overrides (win over the global default in either direction):
  pumpdump:
    raw_dump: false
  exhaust:
    raw_dump: false
  cvd:
    raw_dump: false
  depthflow:
    raw_dump: false
  hawkes:
    raw_dump: false
  fluid:
    raw_dump: false
  leadlag:
    raw_dump: false
  liquidity:
    raw_dump: false
  sentiment:
    raw_dump: false
  correlation:
    raw_dump: false
  toxicity:
    raw_dump: false

ui:
  addr: 127.0.0.1:8765
  heartbeat_interval: 1s
