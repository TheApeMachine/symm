storage:
  s3:
    # Object storage for whole-blob artifacts. Hindsight's record families are
    # Iceberg tables and do not pass through here; what remains is the
    # associative model's encoded state.
    bucket: symm
    region: us-east-1
    endpoint: http://s3.seaweed.home.arpa
    # SeaweedFS serves this cluster unauthenticated. Signing with empty
    # credentials fails, so anonymous access is declared rather than inferred
    # from the absence of a key.
    anonymous: true
    max_idle_conns: 128
    max_idle_conns_per_host: 128
    max_conns_per_host: 128
    idle_conn_timeout: 90s
    response_header_timeout: 30s
    request_timeout: 10s
  iceberg:
    # SeaweedFS serves one Iceberg catalog per table bucket, so warehouse
    # selects the catalog rather than naming a directory inside a shared one.
    # A table bucket is an ordinary bucket carrying an s3tables.metadata
    # attribute, so it cannot be the same bucket as storage.s3.bucket above.
    uri: http://iceberg.seaweed.home.arpa
    warehouse: s3://symmwarehouse/
    # Operational retry budget for rejected concurrent catalog commits.
    # Iceberg refreshes and rebases the append; unknown commit outcomes fail.
    commit_retries: 4
    # Maximum binary payload bytes in one Iceberg snapshot. Larger buffers
    # become successive snapshots so the REST catalog call and the S3 object
    # write finish inside Seaweed's idle timeout. This is a catalog transport
    # bound, not a market horizon. Arrow's 2 GiB Binary offset remains the
    # representation ceiling inside a snapshot.
    append_bytes: 16777216

workbench:
  # The Analytical Workbench runs as a standalone service decoupled from the
  # critical trading path to protect the live solvers from garbage collection pauses.
  addr: ":8081"
  url: "http://127.0.0.1:8081/workbench/query"
  memory_limit: 16GB
  max_temp_directory_size: 64GB

experimental:
  # Presentation and diagnostic experiments are opt-in and paper-only.
  enabled: false

runtime:
  workspace:
    # Disruptor slot count. Must be a power of two. Each sequence keeps its own
    # feed snapshot so signals see that event, not only the latest register slot.
    buffer: 8192

system:
  data_path: ~/.symm/data
  pprof:
    enabled: false
    addr: 127.0.0.1:6060
  log:
    level: debug
  streaming:
    max_shards: 128
    lane_capacity: 4096
    max_workers: 0
    spin_limit: 64
    drain_limit: 256
  bus:
    # The thesis broadcast re-asserts itself on this interval while an epoch is
    # unfinished, so a module that missed or coalesced a wake-up is woken again
    # instead of leaving the epoch stalled with no stamp and no way to recover.
    # Lower costs idle broadcasts; higher lengthens the worst-case recovery.
    heartbeat: 250ms
  websocket:
    # UI delivery budget only; does not control decisions or tape maturity.
    learning_interval: 250ms
    endpoints:
      public: "wss://ws.kraken.com/v2"
      private: "wss://ws-auth.kraken.com/v2"
      level3: "wss://ws-l3.kraken.com/v2"
      futures: "wss://futures.kraken.com/ws/v1"
      tradebalance: "/0/private/TradeBalance"
      tradevolume: "/0/private/TradeVolume"
    # How often a session sends its keepalive. A half-open connection — one
    # side gone without a close, as when a mobile link drops out of reception —
    # is invisible to a socket that only reads. The periodic write is what
    # exposes it: the unacknowledged retransmits eventually fail the socket.
    ping_interval: 20s
    decay_rate: 0.33
    calls_per_update: 2
    calls_per_second: 1
    channel:
      # Public trade and Level3 ingress queues and UI fan-out. Undersizing
      # stalls the Kraken reader behind book decode and starves trades.
      # ponytail: fixed capacity is an intentional simplification with memory
      # and burst limits; telemetry-driven or adaptive sizing is the upgrade path.
      buffer: 4096

hindsight:
  capture:
    # Controls whether the root symm process tees and drains live streaming
    # market and sensory data into Iceberg. Set to true only for standalone recording;
    # when symm collect runs on a dedicated collector node, leave false here to
    # prevent duplicate table writes and fragmented short runs.
    enabled: false
    # Records queue in memory while the writer drains them into the tables.
    # Maximum records collected before one drain of the queue.
    batch_size: 256
    # Drain a partial batch even when no further observations arrive.
    flush_interval: 50ms
    # Commit cadence is deliberately far coarser than the drain above. An
    # Iceberg commit writes a snapshot, a manifest, a manifest list and a new
    # metadata file, so committing per drain produced three metadata objects
    # per data file and left the table in thousands of tiny fragments.
    # Buffered rows stay in memory until one of these is reached.
    commit_rows: 20000
    commit_interval: 30s
  rehearsal:
    # Replay workers practise on the whole capture archive, not only the run
    # being recorded now: a confirmed excursion needs a qualifying move and
    # then a retracement away from its extremum, which a freshly started
    # process has not had time to produce. The live run is always read;
    # completed runs are then taken newest first until this many observations
    # are resident, so a larger archive degrades to the most recent tape
    # rather than exhausting memory. A run is always read whole — stopping
    # mid-run would end a tape at the budget rather than at the record.
    observation_budget: 500000

resonance:
  # Chord-level surprise gate (strategy symbolTape.advance, shared by train
  # and run): the midpoint rule proposes a chord; it is appended to the
  # grammar only when the resonance solver's surprise, as a causal running
  # z-score per symbol, reaches surprise_z. Before that the symbol warms up:
  # its gate stays closed (chords blocked, counted "cold") until its coder's
  # error has settled, i.e. its average at the coder's fastest rate (0.15)
  # is no longer below its average at learning_rate. There is no warm-up
  # length to configure; the z-score accumulates only once warm. gate: false
  # appends every proposed chord. Every policy records these settings; run
  # refuses a policy epoch trained under different ones. No defaults in code.
  gate: true
  surprise_z: 1.0
  # The resonance solver's pace: each coder's resting learning rate, and the
  # slow rate of its warm-up error average. At most 0.15 (the coders' fastest).
  learning_rate: 0.01
  layers: 3

regulator:
  # Number of model-surprise observations retained for the dashboard only.
  # Predictive learning retains its own sufficient statistics separately.
  history_capacity: 256

kraken:
  credentials:
    # Environment variable NAMES (never values) holding each process role's
    # Kraken API key pair. Kraken checks nonces per API key, so processes
    # that run at the same time sign with different keys. A role whose
    # variables are unset is a startup error; no role falls back to another.
    collector:
      key_env: L3_API_KEY
      secret_env: L3_API_SECRET
    main:
      key_env: KRAKEN_API_KEY
      secret_env: KRAKEN_API_SECRET

market:
  model: paper
  quote_currency: USD
  taker_fee: 0.8
  balance: 200 # No, this is neither a typo nor a test amount. It is the exact amount I 
               # found in my Kraken account, and the only money I am willing to risk.
               # Now, you might think this system is therefore overkill. That is a valid point.
               # But what if it works? The system tracks Level 3 order book, ticker, and trade 
               # data across more than 640 assets. On any given day, some of those assets can 
               # rise 100% or more. Let's say we capture only 50% of those moves. Why 50%?
               # Because with micro-caps, you have to get out while there is still serious buying 
               # power underneath you. Trying to exit at the peak is exactly how you discover that 
               # the entire order book can dissolve beneath your position.
               #
               # Start with $200 and compound at 50%:
               #
               # Day 0   $200.00
               # Day 5   $1,518.75
               # Day 10  $11,533.01
               # Day 15  $87,578.78
               # Day 20  $665,051.35
               # Day 25  $5,050,233.66
               # Day 30  $38,350,211.85
               #
               # Obviously, let's be realistic: you are not getting there that fast.
               # Long before then, the constraint stops being capital and becomes liquidity.
               # At some point, you simply cannot sell a large position into a micro-cap 
               # order book without becoming the market event yourself. You have to start 
               # deploying smaller slices of your capital, sized according to the liquidity 
               # actually available in the book.
               #
               # trading.allocation.touch_carry_divisor enforces that cap on
               # every entry: at most one third of the touch bid, or nothing if
               # the venue minimum is larger than that slice. Profitable and
               # sympathetic beats greedy; the market sets size, not ambition.
               #
               # Because if you're paying to be your own liquidity, you're gonna have a bad time.
               #
               # The point of the numbers is not to pretend that $200 magically turns into $38 
               # million in thirty days.
               #
               # The point is that thinking about this as a "$200 crypto-trading bot" is the 
               # wrong frame of reference.
               #
               # It is not a bot.
               #
               # It is not a High-Frequency Trading algorithm.
               #
               # It is an activated research environment designed to identify opportunity 
               # in the precursors to market events, observe those events as they develop, 
               # and participate only while the market structure can actually support the 
               # position.
               #
               # Or, if you prefer the less respectable description:
               #
               # It is a wild ride on the coattails of the manipulators of a highly 
               # manipulated market.

  instrument:
    excluded:
      - USD 
      - EUR
      - GBP
      - AUD
      - CAD
      - CHF
      - JPY
      - NZD
      - USDT
      - USDC
      - DAI
      - PYUSD
      - FDUSD
      - TUSD
      - USDG
      - USDE
      - EURT
      - EURC
      - GUSD
      - BUSD
      - FRAX
      - LUSD
      - CUSD
      - USD0
      - USDS
      - RLUSD
      - UST
      # Large-cap pairs: short holds rarely clear ~1.6% round-trip taker friction.
      - BTC
      - ETH
      - SOL
      - LTC
      - ADA
      - DOT
      - LINK
      - PEPE
  book_depth_levels: 25
  baseline_halflife: 30s
  l3_enabled: true
  l3_depth: 10
  # Kraken's standard L3 subscription-rate budget. Depth determines the cost
  # per symbol, so websocket batches are derived from this value.
  l3_rate_limit: 200
  # How long after subscribing every level3 symbol must have its snapshot;
  # symbols still without one are raised as an error.
  l3_snapshot_timeout: 30s
  # Lock-free MPMC ingress requires a power-of-two capacity. Producers apply
  # backpressure rather than discard authoritative order-level deltas.
  # ponytail: fixed capacity is an intentional simplification with memory and
  # burst limits; telemetry-driven or adaptive sizing is the upgrade path.
  l3_ring_capacity: 8192
  # Book signals read the verified book version in effect at each frame's
  # venue time, not the live book. Retention is sized from the data: the book
  # keeps every version back to the largest lag a lookup has asked for, so a
  # frame never reads a book newer than itself; a lookup older than what is
  # retained reads no book (missing evidence, counted by Book.HistoryMisses).
  # This optional per-symbol version cap bounds memory only; 0 leaves
  # retention to the learned lag.
  book_history_limit: 0
  # Level3 subscribe frames are sized to one second of l3_rate_limit (40
  # symbols at depth 10, cost 5 each; Kraken's limit is per second). Measured:
  # at 1s Kraken silently drops every other full-budget frame (no ack, no
  # error; 208 of 621 never seeded), so frames go out every 2s.
  subscribe:
    pace: 2s
    batch: 25
  book:
    depth: 10
  forecast:
    # Dimensionless RLS covariance prior and memory policy for the per-symbol,
    # next-L3-epoch mid-return learner. A factor of one retains all observations
    # without imposing one wall-clock decay scale on every market.
    rls:
      initial_variance: 1.0
      forgetting_factor: 1.0
  manifold:
    # Maximum chronological lifetime observations retained per admitted symbol.
    lifetime_capacity: 4096
    # Zero keeps the solver MaxDelta from physics/fluid DefaultConfig.
    integration_interval: 0

ui:
  addr: 127.0.0.1:8765
  webrtc:
    # Per-channel records retained for an attached manifold viewer. Reaching
    # this bound backpressures publication rather than dropping an unpainted state.
    client_queue_frames: 4
    # SCTP buffered-amount high-water expressed in RFC 8831 16 KiB segments.
    # Flow control waits for capacity before enqueueing the next segment.
    buffered_segments: 64
  websocket:
    # UI delivery budget only; does not control decisions or tape maturity.
    learning_interval: 100ms
    # Upper bound for one ordered dashboard batch. Later frames remain queued
    # for the next message; no telemetry record is truncated or discarded.
    max_message_bytes: 4194304

trading:
  model: paper
  allocation:
    # Upper bound on quote cash one desk entry may spend (Enter / Quote).
    max_fraction: 0.20
    # Entry quantity cap: best-bid size divided by this divisor. 3 means we
    # take at most one third of what the touch can carry, so a touch exit
    # still has margin if the book thins. Below instrument minimum → no entry.
    touch_carry_divisor: 3
  persistence:
    # Stoploss checkpoints and trade-journal updates leave guardian threads
    # through this ordered, non-dropping queue.
    queue_depth: 1024
    batch_size: 128

risk:
  max_fraction: 0.20

learning:
  policy_prefix: "model/current/"
  enter_suffix: "/enter.bin"
  exit_suffix: "/exit.bin"
  minimum_path_confidence: 2
  threshold_start: 0.5
  threshold_step: 0.05
  explore_temporal_penalty: 0.0
  threshold_floor: 0.05
  threshold_ceil: 0.95
  vocab_size: 15
  default_window_size: 15
  shannon_capacity: 0.45
  excursion_timeout: 45m
  max_excursion_bars: 8
  policy_shadow_bars: 32
  min_supported_horizon: 2
  cliff_horizon_drop: 2
  cliff_energy_mult: 1.4
  gate_opposition_floor: 0.05
  gate_opposition_ceil: 0.95
  gate_regime_ignition_floor: 0.05
  gate_regime_ignition_ceil: 0.95
  gate_regime_friction_floor: 0.05
  gate_regime_friction_ceil: 0.95
  gate_maturity_floor: 0.05
  gate_maturity_ceil: 0.95
  max_path_objects: 8192
  # Append-only JSONL: virtual/venue open, review, close, emergency (empty = off).
  position_trace_path: logs/position_trace.jsonl

detector:
  # Fewest ticks in the clamped A→B precursor before detect emits an excursion.
  min_precursor_ticks: 10
  # Pull B, C, entry, and exit back by this fraction of the A→B span (ticks).
  execution_lead_fraction: 0.1

paper:
  # `make run` never writes storage: every paper-trade record (one data.Value
  # per traded decision, data.PaperKeys) is appended to this local file, and
  # `make paper` uploads it under paper/<action>/<symbol>/<epoch>/<seq>.bin.
  # Relative paths are relative to the working directory. Required while
  # paper trading is active: there is no default in code.
  records_path: paper_records/records.bin

signals:
  depthflow:
    sampleSize: 128
  pumpdump:
    baselineCapacity: 128

manifold:
  grid:
    x: 64
    y: 64
    z: 64
  phase:
    lattice:
      width: 1024
