<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlphaGo-Style State Unfolding Tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #0b0d14;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #controls {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .badge {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div id="controls">
    <button onclick="stepSearch()">Send 1 Scout (Unfold Tree)</button>
    <button id="runBtn" onclick="toggleRun()">Auto Explore</button>
    <button onclick="resetTree()" style="background: #475569;">Reset Tree</button>
    <div class="badge">Simulated Rollouts: <span id="scoutCount">0</span></div>
    <div class="badge" style="color: #38bdf8;">Squares = Your Choices | Circles = Market Reactions</div>
</div>

<div id="canvas-container"></div>

<script>
let totalScouts = 0;
let isRunning = false;
let activePath = [];
let animProgress = 0;

// Tree Node class representing Game States
class TreeNode {
    constructor(id, label, type, x, y, parent = null) {
        this.id = id;
        this.label = label;
        this.type = type; // 'AGENT' (square) or 'MARKET' (circle)
        this.x = x;
        this.y = y;
        this.parent = parent;
        this.children = [];
        this.visits = 0;
        this.totalScore = 0;
        this.unfolded = false;
    }

    avgScore() {
        return this.visits > 0 ? (this.totalScore / this.visits).toFixed(2) : "0.0";
    }

    addChild(node) {
        this.children.push(node);
        node.parent = this;
        return node;
    }
}

let rootNode;
let allNodes = [];
let logs = [];

function setup() {
    let canvas = createCanvas(1060, 620);
    canvas.parent("canvas-container");
    resetTree();
}

function resetTree() {
    totalScouts = 0;
    allNodes = [];
    logs = [];
    document.getElementById("scoutCount").innerText = totalScouts;

    // ROOT: Current market state
    rootNode = new TreeNode("root", "Observed: 3100x Volume Surge\n(Coiled Compression)", "MARKET", 530, 45);
    allNodes.push(rootNode);

    // DEPTH 1 (Your Move): Enter Precursor vs Wait for Ignition vs Pass
    let enterNode = new TreeNode("enter", "MY MOVE:\nEnter Precursor", "AGENT", 250, 150);
    let waitNode  = new TreeNode("wait",  "MY MOVE:\nWait 1 Bar", "AGENT", 530, 150);
    let passNode  = new TreeNode("pass",  "MY MOVE:\nPass / Walk Away", "AGENT", 810, 150);

    rootNode.addChild(enterNode);
    rootNode.addChild(waitNode);
    rootNode.addChild(passNode);
    allNodes.push(enterNode, waitNode, passNode);

    addLog("Tree Root Initialized at [Coiled Compression].");
    addLog("First branch unfolding: Evaluating [Enter Now] vs [Wait] vs [Pass]...");
}

function addLog(msg) {
    logs.unshift(msg);
    if (logs.length > 5) logs.pop();
}

function toggleRun() {
    isRunning = !isRunning;
    let btn = document.getElementById("runBtn");
    btn.innerText = isRunning ? "Pause" : "Auto Explore";
    btn.style.background = isRunning ? "#ef4444" : "#2563eb";
}

function stepSearch() {
    totalScouts++;
    document.getElementById("scoutCount").innerText = totalScouts;

    // Simulate AlphaGo scout descending and unfolding the tree
    activePath = [rootNode];

    // Pick first branch (Your action)
    // 70% of exploratory energy goes to Enter, 20% to Wait, 10% to Pass
    let r = random();
    let myAction = rootNode.children[0]; // Enter
    if (r > 0.70 && r <= 0.90) myAction = rootNode.children[1]; // Wait
    if (r > 0.90) myAction = rootNode.children[2]; // Pass

    activePath.push(myAction);

    let score = 0;

    if (myAction.id === "enter") {
        // Unfold DEPTH 2 (Market's response): Pumper launches ignition OR Fakeout happens
        if (myAction.children.length === 0) {
            let mktIgnite  = new TreeNode("mkt_ignite",  "MARKET MOVES:\nIgnition! Book Thins", "MARKET", 170, 265);
            let mktFakeout = new TreeNode("mkt_fakeout", "MARKET MOVES:\nFakeout: Volume Stalls", "MARKET", 340, 265);
            myAction.addChild(mktIgnite);
            myAction.addChild(mktFakeout);
            allNodes.push(mktIgnite, mktFakeout);
        }

        // 75% chance pumper moves forward with ignition, 25% fakeout
        let mktMove = (random() < 0.75) ? myAction.children[0] : myAction.children[1];
        activePath.push(mktMove);

        if (mktMove.id === "mkt_ignite") {
            // Unfold DEPTH 3 (My response to ignition): Sell into Climax vs Greedily Hold
            if (mktMove.children.length === 0) {
                let actExitIntoClimax = new TreeNode("act_climax_exit", "MY MOVE:\nExit into FOMO Bids", "AGENT", 110, 390);
                let actHoldMore       = new TreeNode("act_hold_more",   "MY MOVE:\nHold for Stoploss",   "AGENT", 240, 390);
                mktMove.addChild(actExitIntoClimax);
                mktMove.addChild(actHoldMore);
                allNodes.push(actExitIntoClimax, actHoldMore);
            }

            // Test whether exiting into climax or holding is better
            let myNextMove = (random() < 0.60) ? mktMove.children[0] : mktMove.children[1];
            activePath.push(myNextMove);

            if (myNextMove.id === "act_climax_exit") {
                // Unfold DEPTH 4 (Final outcome)
                if (myNextMove.children.length === 0) {
                    let endWin = new TreeNode("end_win", "PAYOFF: +120%\nSold into Bids!", "MARKET", 110, 500);
                    myNextMove.addChild(endWin);
                    allNodes.push(endWin);
                }
                activePath.push(myNextMove.children[0]);
                score = +1.2;
                addLog("Path: [Enter Precursor] ➔ [Ignition] ➔ [Exit into Climax Bids] = +120% WIN!");
            } else {
                // Greedily held: Rug pull happens, bids evaporate
                if (myNextMove.children.length === 0) {
                    let endRug = new TreeNode("end_rug", "PAYOFF: -45%\nBids Pulled / Dump", "MARKET", 240, 500);
                    myNextMove.addChild(endRug);
                    allNodes.push(endRug);
                }
                activePath.push(myNextMove.children[0]);
                score = -0.45;
                addLog("Path: [Enter Precursor] ➔ [Ignition] ➔ [Greedy Hold] ➔ Rug pulled through stop (-45%)!");
            }
        } else {
            // Fakeout: tight exit
            if (mktMove.children.length === 0) {
                let endCut = new TreeNode("end_cut", "PAYOFF: -4%\nControlled Cut", "MARKET", 340, 390);
                mktMove.addChild(endCut);
                allNodes.push(endCut);
            }
            activePath.push(mktMove.children[0]);
            score = -0.04;
            addLog("Path: [Enter Precursor] ➔ [Market Fakeout] ➔ Cut trade quickly (-4%).");
        }
    } else if (myAction.id === "wait") {
        // Unfold DEPTH 2 for Wait: You wait for Ignition confirmation!
        if (myAction.children.length === 0) {
            let waitIgnite = new TreeNode("wait_ignite", "MARKET MOVES:\nIgnition already +25%!", "MARKET", 530, 265);
            myAction.addChild(waitIgnite);
            allNodes.push(waitIgnite);
        }
        let mktWaitMove = myAction.children[0];
        activePath.push(mktWaitMove);

        // From here, you buy the top of ignition
        if (mktWaitMove.children.length === 0) {
            let buyLate = new TreeNode("buy_late", "MY MOVE:\nBuy top of Ignition", "AGENT", 530, 390);
            mktWaitMove.addChild(buyLate);
            allNodes.push(buyLate);
        }
        activePath.push(mktWaitMove.children[0]);

        if (mktWaitMove.children[0].children.length === 0) {
            let endLateLoss = new TreeNode("end_late_loss", "PAYOFF: -35%\nBought Top / Dumped", "MARKET", 530, 500);
            mktWaitMove.children[0].addChild(endLateLoss);
            allNodes.push(endLateLoss);
        }
        activePath.push(mktWaitMove.children[0].children[0]);
        score = -0.35;
        addLog("Path: [Wait for Confirmation] ➔ Bought top of Ignition ➔ Pumper dumped (-35%).");
    } else {
        // Pass: zero
        if (myAction.children.length === 0) {
            let endNeutral = new TreeNode("end_neutral", "PAYOFF: 0%\nCash Preserved", "MARKET", 810, 265);
            myAction.addChild(endNeutral);
            allNodes.push(endNeutral);
        }
        activePath.push(myAction.children[0]);
        score = 0.0;
        addLog("Path: [Pass] ➔ Opportunity bypassed. Flat return (0%).");
    }

    // Backpropagate rewards up the explored path
    for (let node of activePath) {
        node.visits++;
        node.totalScore += score;
    }

    animProgress = 0;
}

function draw() {
    background("#0b0d14");

    if (isRunning && frameCount % 22 === 0) {
        stepSearch();
    }

    // Draw tree connections
    stroke("#334155");
    strokeWeight(1.5);
    for (let node of allNodes) {
        if (node.parent) {
            line(node.parent.x, node.parent.y, node.x, node.y);
        }
    }

    // Draw all active tree nodes
    for (let node of allNodes) {
        drawNode(node);
    }

    // Animate scout beam descending through the unfolding tree
    if (activePath.length > 1) {
        animProgress = min(1, animProgress + 0.06);
        let totalSegments = activePath.length - 1;
        let scaledProgress = animProgress * totalSegments;
        let segIndex = floor(scaledProgress);
        let segFrac = scaledProgress - segIndex;

        if (segIndex < totalSegments) {
            let n1 = activePath[segIndex];
            let n2 = activePath[segIndex + 1];
            let px = lerp(n1.x, n2.x, segFrac);
            let py = lerp(n1.y, n2.y, segFrac);

            fill("#facc15");
            noStroke();
            circle(px, py, 14);

            // Highlight path
            stroke("#facc15");
            strokeWeight(3);
            line(n1.x, n1.y, px, py);
        }
    }

    // Draw Log Console
    drawLogConsole();
}

function drawNode(n) {
    rectMode(CENTER);

    if (n.type === "AGENT") {
        // Agent move: Sharp Square Box (Your Choice)
        fill("#1e293b");
        stroke("#38bdf8");
        strokeWeight(2);
        rect(n.x, n.y, 140, 48, 6);
    } else {
        // Market move: Oval / Pill Box (Market's Reaction)
        fill("#141a29");
        stroke(n.id.includes("win") ? "#10b981" : (n.id.includes("loss") || n.id.includes("rug") ? "#ef4444" : "#a855f7"));
        strokeWeight(2);
        rect(n.x, n.y, 145, 48, 24);
    }

    noStroke();
    fill("#f8fafc");
    textAlign(CENTER, CENTER);
    textSize(10);
    textStyle(BOLD);
    text(n.label, n.x, n.y - 6);

    if (n.visits > 0) {
        textStyle(NORMAL);
        fill("#94a3b8");
        textSize(9);
        text(`Visits: ${n.visits} | EV: ${n.avgScore()}`, n.x, n.y + 14);
    }
}

function drawLogConsole() {
    fill("#06080e");
    stroke("#1e293b");
    strokeWeight(1);
    rectMode(CORNER);
    rect(30, 540, 1000, 70, 6);

    noStroke();
    fill("#38bdf8");
    textAlign(LEFT, TOP);
    textSize(10);
    textStyle(BOLD);
    text("ALPHA-GO STYLE TREE EXPLORATION LOG:", 45, 546);

    textStyle(NORMAL);
    textSize(10);
    for (let i = 0; i < logs.length; i++) {
        fill(logs[i].includes("WIN") ? "#34d399" : (logs[i].includes("loss") || logs[i].includes("rug") || logs[i].includes("Top") ? "#f87171" : "#cbd5e1"));
        text(logs[i], 45, 560 + (i * 13));
    }
}
</script>

</body>
</html>
