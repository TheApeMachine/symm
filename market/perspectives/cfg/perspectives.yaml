version: 2
branches:
    - when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - any:
                - subject: price
                  unit: percentage
                  ago: 30
                  op: rose_by
                  value: 8
                - subject: signal
                  category: vertical_ignition
                  unit: snr
                  op: at_least
                  value: 1
                - subject: signal
                  category: coiled_compression
                  unit: snr
                  op: at_least
                  value: 1
            - subject: price
              unit: percentage
              ago: 8
              op: fell_by
              value: 3
      do:
        type: market
        fraction: 0.25
    - when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - any:
                - subject: signal
                  category: active_reversal
                  unit: snr
                  op: at_least
                  value: 1
                - subject: signal
                  category: faded_exhaustion
                  unit: snr
                  op: at_least
                  value: 1
      do: settle_position
    - when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - subject: position
              lifecycle: has_started
              op: equals
      do:
        type: stop_loss
        offset: 0.012
    - when:
        subject: position
        lifecycle: holding
        op: equals
      do:
        type: trailing_stop
        offset: 0.01
