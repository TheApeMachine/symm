version: 1
branches:
    - branches:
        - category: volume_starvation
          observation: not_holding
          condition: '>='
          unit: snr
          value: 0
          value_set: true
          action:
            type: limit
      category: systemic_slump
      condition: '>='
      unit: snr
      value: 0
      value_set: true
    - category: systemic_beta
      observation: holding
      condition: '>='
      unit: snr
      value: 0
      value_set: true
      action:
        type: settle_position
