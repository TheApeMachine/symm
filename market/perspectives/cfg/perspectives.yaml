version: 2

# ─────────────────────────────────────────────────────────────────────────────
# A DECISION TREE AS A THOUGHT PROCESS
#
# This is a ground-up redesign of the tree language (the current interpreter does
# NOT read this yet — we adapt the code once we agree the language can express
# what it needs to). Every node is a "thought":
#
#   when:  the condition that makes this thought relevant
#   then:  the reasoning that follows once `when` holds — MONITORED OVER TIME, so
#          `then` means "and then, on the ticks that follow, watch for ..."
#   do:    the decision taken at this point (an action), if any. A node may both
#          `do` and `then` — "act, and keep thinking" (enter, then manage).
#
# A `when` predicate is either a single comparison or a boolean of predicates:
#   all: [...]   every sub-predicate holds            (AND)
#   any: [...]   at least one holds                    (OR)
#   not: {...}   the sub-predicate does not hold       (NOT)
#
# A leaf comparison reads a SUBJECT, optionally COMPARED TO `ago` MEASUREMENTS
# AGO (temporal), against a target:
#   subject: signal    a microstructure category's strength  (+ category, unit: snr|confidence)
#   subject: regime    the price-action regime               (+ regime)
#   subject: position  the trade's own lifecycle             (+ lifecycle: not_holding|holding|
#                                                              has_started|has_continued|has_ended)
#   subject: price     last traded price                     (unit: percentage for relative)
#   subject: volume    traded volume
#   subject: elapsed   time in the position                  (unit: time_minutes|time_seconds)
#
#   op:  at_least(>=) at_most(<=) above(>) below(<) equals(==)
#        rose_by / fell_by      change over `ago` window crosses `value` (Unit = abs or %)
#        crossed_up / crossed_down   the value crossed `value` within `ago` (an EDGE — "becomes")
#   ago: 0 = now; N = compared to N measurements ago
#
# Three horizons, each a complete thought (spot the setup -> confirm it over time
# -> commit -> manage as it plays out), long-only because entries are buys.
# ─────────────────────────────────────────────────────────────────────────────

branches:

  # ═══════════════ SHORT — flash-pump scalp ═══════════════
  # "If I see coiled compression AND the regime is trending, THEN WHEN the
  #  vertical ignition fires (snr crosses up) OR price jumps >1% vs 5 ago,
  #  strike fast — then ride it and bail the moment it rolls over."
  - when:
      all:
        - { subject: regime, op: equals, regime: trending }
        - { subject: signal, category: coiled_compression, unit: snr, op: at_least, value: 1.0 }
    then:
      # then WHEN the ignition fires AND it has overtaken the compression
      # (metric-to-metric: the breakout now dominates the coil it came from):
      - when:
          all:
            - { subject: signal, category: vertical_ignition, unit: snr, ago: 5, op: crossed_up, value: 1.5 }
            - { subject: signal, category: vertical_ignition, unit: snr, op: above,
                versus: { subject: signal, category: coiled_compression, unit: snr } }
        do: iceberg
        then:
          # entered — now the thought continues as position management. A scalp
          # rides a TIGHT leash (per-node offsets override the global defaults):
          - when: { subject: position, op: equals, lifecycle: has_started }
            do: { type: stop_loss, offset: 0.010 }    # 1.0% protective floor, once
          - when: { subject: position, op: equals, lifecycle: has_continued }
            do: { type: trailing_stop, offset: 0.008 } # 0.8% trail — pump still pumping, ratchet
          - when:
              any:
                - { subject: position, op: equals, lifecycle: has_ended }
                - { subject: signal, category: active_reversal, unit: snr, ago: 3, op: crossed_up, value: 1.0 }
            do: settle_position      # it rolled over / reversed — get out ahead of the dump

  # ═══════════════ MEDIUM — momentum trend ═══════════════
  # "If the regime is bullish AND I see real endogenous alpha AND aggressive
  #  drive AND volume has risen >30% vs 20 ago (genuine participation), enter
  #  patiently with a limit — trail the trend, take profit when it overheats,
  #  and time-stop out if it never continues."
  - when:
      all:
        - { subject: regime, op: equals, regime: bullish }
        - { subject: signal, category: endogenous_alpha, unit: snr, op: at_least, value: 1.0 }
        - { subject: signal, category: aggressive_drive, unit: snr, op: at_least, value: 1.0 }
        - { subject: volume, unit: percentage, ago: 20, op: rose_by, value: 30.0 }
    then:
      - when: { subject: position, op: equals, lifecycle: not_holding }
        do: limit
        then:
          - when: { subject: position, op: equals, lifecycle: has_started }
            do: stop_loss_limit
          - when: { subject: position, op: equals, lifecycle: has_continued }
            do: trailing_stop
          - when: { subject: signal, category: thermal_exhaustion, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            do: take_profit_limit    # the trend is overheating — lock it in
          - when:
              all:
                - { subject: position, op: equals, lifecycle: holding }
                - { subject: elapsed, unit: time_minutes, op: at_least, value: 30.0 }
                - not: { subject: position, op: equals, lifecycle: has_continued }
            do: settle_position      # time-stop: held 30 min and the move never continued

  # ═══════════════ LONG — accumulation on absorption ═══════════════
  # "If the regime is bullish AND I see clear hidden absorption over hard
  #  support AND there is NO toxic bluff, THEN WHEN the book imbalance loads
  #  long, accumulate with a limit — hold it on a wide trailing stop and only
  #  let go on a market slump or a confirmed reversal."
  - when:
      all:
        - { subject: regime, op: equals, regime: bullish }
        - { subject: signal, category: hidden_absorption, unit: confidence, op: at_least, value: 0.6 }
        - { subject: signal, category: hard_support, unit: snr, op: at_least, value: 1.0 }
        - not: { subject: signal, category: toxic_bluff, unit: snr, op: above, value: 0.0 }
    then:
      - when: { subject: signal, category: loaded_imbalance, unit: snr, ago: 10, op: crossed_up, value: 1.0 }
        do: limit
        then:
          # accumulation rides a WIDE leash — give the thesis room to breathe:
          - when: { subject: position, op: equals, lifecycle: has_started }
            do: { type: trailing_stop, offset: 0.050 }   # 5% trail, set once
          - when:
              any:
                - { subject: signal, category: systemic_slump, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
                - { subject: signal, category: active_reversal, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            do: settle_position
