version: 2
branches:
    - when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - any:
                - subject: price
                  unit: percentage
                  ago: 30
                  op: rose_by
                  value: 8
                - subject: signal
                  category: vertical_ignition
                  unit: snr
                  op: at_least
                  value: 1
                - subject: signal
                  category: coiled_compression
                  unit: snr
                  op: at_least
                  value: 1
            - subject: price
              unit: percentage
              ago: 8
              op: fell_by
              value: 3
      do:
        type: market
        fraction: 0.25
    # PRIORITY CONTRACT: sibling order below IS economic priority. The evaluator
    # resolves same-depth ties to the FIRST sibling, so when several holding
    # branches fire on one tick, settle_position (immediate market close) wins
    # over stop_loss, which wins over trailing_stop (both only ARM levels).
    # Reordering these lines reorders risk management — deliberately.
    - when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - any:
                - subject: signal
                  category: active_reversal
                  unit: snr
                  op: at_least
                  value: 1
                - subject: signal
                  category: faded_exhaustion
                  # Confidence, not SNR: by the third exhausted tick the SNR has
                  # decayed toward its ~0.5 habitual floor while confidence stays
                  # high — surprise-gated exhaustion exits go blind exactly when
                  # the condition persists. Observed ceiling on 2026-06-07 tape:
                  # conf max 0.48, p90 0.38 → 0.35 is its top decile. (snr ≥ 1
                  # here effectively never held.)
                  unit: confidence
                  op: at_least
                  value: 0.35
      do: settle_position
    - when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - subject: position
              lifecycle: has_started
              op: equals
      do:
        type: stop_loss
        offset: 0.012
    - when:
        subject: position
        lifecycle: holding
        op: equals
      do:
        type: trailing_stop
        offset: 0.01
