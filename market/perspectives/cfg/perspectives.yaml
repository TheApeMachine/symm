version: 2
branches:
    - when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - subject: signal
              category: laminar
              unit: snr
              op: at_least
              value: 1
            - subject: regime
              regime: bullish
              op: equals
            - subject: signal
              category: extreme_scarcity
              unit: snr
              op: at_least
              value: 1
      do: market
    - when:
        subject: position
        lifecycle: holding
        op: equals
      do:
        type: trailing_stop
        offset: 0.01
