version: 2

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION PLAYBOOK — Version 2 Thought Tree
#
# Evaluated with EvaluateStateful. Entries default to buy; `side: sell` opens short.
#
# ORDERING CONTRACT (load-bearing)
#   • Exit managers are listed FIRST. Among siblings at the same depth, the
#     evaluator keeps the first firing action — so managers run most-specific → fallback.
#   • Within each manager, children run emergency exit → take profit → trail → stop → time.
#   • Entry branches follow, ordered most-specific → general.
#   • Nested exits under entries are omitted — they orphan on the holding flip.
#   • volume = quote notional (ticker volume × last), distinct-change indexed like price.
#
# UNIT POLICY (load-bearing — see measurement.go)
#   • confidence — cross-sectional band clarity: "how decisively does this reading
#     sit inside its assigned category right now?" Use for structural states, book
#     quality, fluid viscosity, liquidity depth, toxicity denies, and level gates
#     where band margin matters more than historical surprise.
#   • snr — temporal surprise: "how unusual is this category win vs this symbol's
#     recent baseline?" Use for crossed_up edges, causal alpha/drive momentum,
#     pump ignition arcs, macro sentiment shifts, and versus comparisons.
#   • Both can appear on one branch when thesis needs clear band occupancy AND
#     a fresh edge (e.g. hidden_absorption confidence + loaded_imbalance crossed_up).
# ─────────────────────────────────────────────────────────────────────────────

branches:

  # ═══════════════════════════════════════════════════════════════════════════
  # EXIT MANAGERS (most-specific first)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Scalp / ignition — tight leash while pump signatures are still live ──
  - when:
      all:
        - { subject: position, op: equals, lifecycle: holding }
        - { subject: signal, category: vertical_ignition, unit: snr, op: at_least, value: 1.5 }
        - { subject: signal, category: coiled_compression, unit: confidence, op: at_least, value: 0.5 }
    then:
      - when:
          any:
            - { subject: position, op: equals, lifecycle: has_ended }
            - { subject: signal, category: active_reversal, unit: snr, ago: 3, op: crossed_up, value: 1.0 }
            - { subject: signal, category: faded_exhaustion, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.55 }
            - { subject: signal, category: toxic_bluff, unit: snr, ago: 3, op: crossed_up, value: 1.0 }
        do: settle_position
      - when:
          subject: signal
          category: thermal_exhaustion
          unit: snr
          ago: 5
          op: crossed_up
          value: 1.0
        do: take_profit_limit
      - when: { subject: position, op: equals, lifecycle: has_continued }
        do: { type: trailing_stop, offset: 0.006 }
      - when: { subject: position, op: equals, lifecycle: has_started }
        do: { type: stop_loss, offset: 0.008 }
      - when:
          all:
            - { subject: elapsed, unit: time_minutes, op: at_least, value: 8.0 }
            - not: { subject: position, op: equals, lifecycle: has_continued }
        do: settle_position

  # ── Trend / drive — medium leash while alpha + flow persist ──
  - when:
      all:
        - { subject: position, op: equals, lifecycle: holding }
        - any:
            - { subject: signal, category: endogenous_alpha, unit: snr, op: at_least, value: 1.0 }
            - { subject: signal, category: aggressive_drive, unit: snr, op: at_least, value: 1.0 }
        - any:
            - { subject: signal, category: laminar, unit: confidence, op: at_least, value: 0.5 }
            - { subject: signal, category: inertial, unit: confidence, op: at_least, value: 0.5 }
        - not:
            subject: signal
            category: vertical_ignition
            unit: snr
            op: above
            value: 2.0
    then:
      - when:
          any:
            - { subject: position, op: equals, lifecycle: has_ended }
            - { subject: signal, category: active_reversal, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: systemic_slump, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: liquidity_shock, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: liquidity_vacuum, unit: confidence, op: at_least, value: 0.6 }
        do: settle_position
      - when:
          any:
            - { subject: signal, category: thermal_exhaustion, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: exhaustion, unit: confidence, op: at_least, value: 0.65 }
        do: take_profit_limit
      - when: { subject: position, op: equals, lifecycle: has_continued }
        do: { type: trailing_stop, offset: 0.012 }
      - when: { subject: position, op: equals, lifecycle: has_started }
        do: { type: stop_loss_limit, offset: 0.012 }
      - when:
          all:
            - { subject: elapsed, unit: time_minutes, op: at_least, value: 45.0 }
            - not: { subject: position, op: equals, lifecycle: has_continued }
        do: settle_position

  # ── Accumulation — wide leash while absorption thesis holds ──
  - when:
      all:
        - { subject: position, op: equals, lifecycle: holding }
        - { subject: signal, category: hidden_absorption, unit: confidence, op: at_least, value: 0.6 }
        - { subject: signal, category: hard_support, unit: confidence, op: at_least, value: 0.5 }
    then:
      - when:
          any:
            - { subject: position, op: equals, lifecycle: has_ended }
            - { subject: signal, category: active_reversal, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: systemic_slump, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: book_thinning, unit: confidence, op: at_least, value: 0.55 }
            - { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.5 }
        do: settle_position
      - when: { subject: position, op: equals, lifecycle: has_continued }
        do: { type: trailing_stop, offset: 0.030 }
      - when: { subject: position, op: equals, lifecycle: has_started }
        do: { type: stop_loss, offset: 0.020 }
      - when:
          all:
            - { subject: elapsed, unit: time_minutes, op: at_least, value: 120.0 }
            - not: { subject: position, op: equals, lifecycle: has_continued }
        do: settle_position

  # ── Short book — cover on squeeze / regime repair ──
  - when:
      all:
        - { subject: position, op: equals, lifecycle: holding }
        - any:
            - { subject: regime, op: equals, regime: bullish }
            - { subject: signal, category: risk_on_surge, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: vertical_ignition, unit: snr, ago: 5, op: crossed_up, value: 1.5 }
            - { subject: signal, category: hidden_absorption, unit: confidence, op: at_least, value: 0.6 }
    then:
      - when:
          any:
            - { subject: position, op: equals, lifecycle: has_ended }
            - { subject: signal, category: active_reversal, unit: snr, ago: 3, op: crossed_up, value: 1.0 }
        do: settle_position
      - when: { subject: position, op: equals, lifecycle: has_continued }
        do: { type: trailing_stop, offset: 0.010 }
      - when: { subject: position, op: equals, lifecycle: has_started }
        do: { type: stop_loss, offset: 0.012 }
      - when:
          all:
            - { subject: elapsed, unit: time_minutes, op: at_least, value: 30.0 }
            - not: { subject: position, op: equals, lifecycle: has_continued }
        do: settle_position

  # ── Universal fallback — any open position ──
  - when: { subject: position, op: equals, lifecycle: holding }
    then:
      - when:
          any:
            - { subject: position, op: equals, lifecycle: has_ended }
            - { subject: signal, category: active_reversal, unit: snr, ago: 3, op: crossed_up, value: 1.0 }
            - { subject: signal, category: systemic_slump, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
            - { subject: signal, category: liquidity_vacuum, unit: confidence, op: at_least, value: 0.55 }
            - { subject: signal, category: liquidity_shock, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
        do: settle_position
      - when:
          all:
            - { subject: position, op: equals, lifecycle: has_continued }
            - { subject: position, side: buy }
        do: { type: trailing_stop, offset: 0.010 }
      - when:
          all:
            - { subject: position, op: equals, lifecycle: has_continued }
            - { subject: position, side: sell }
        do: { type: trailing_stop, offset: 0.012 }
      - when:
          all:
            - { subject: position, op: equals, lifecycle: has_started }
            - { subject: position, side: buy }
        do: { type: stop_loss, offset: 0.010 }
      - when:
          all:
            - { subject: position, op: equals, lifecycle: has_started }
            - { subject: position, side: sell }
        do: { type: stop_loss, offset: 0.012 }
      - when:
          all:
            - { subject: elapsed, unit: time_minutes, op: at_least, value: 30.0 }
            - not: { subject: position, op: equals, lifecycle: has_continued }
        do: settle_position

  # ═══════════════════════════════════════════════════════════════════════════
  # ENTRY STRATEGIES (most-specific first; flat only at confirmation)
  # ═══════════════════════════════════════════════════════════════════════════

  # 1 — Flash pump scalp: coil → ignition edge → iceberg
  - when:
      all:
        - { subject: regime, op: equals, regime: trending }
        - { subject: signal, category: coiled_compression, unit: confidence, op: at_least, value: 0.55 }
        - not: { subject: regime, op: equals, regime: choppy }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.45 }
        - not: { subject: signal, category: saturation, unit: confidence, op: at_least, value: 0.55 }
        - not: { subject: signal, category: turbulent, unit: confidence, op: at_least, value: 0.5 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: signal, category: vertical_ignition, unit: snr, ago: 5, op: crossed_up, value: 1.5 }
            - { subject: signal, category: vertical_ignition, unit: snr, op: above,
                versus: { subject: signal, category: coiled_compression, unit: snr } }
            - { subject: price, unit: percentage, ago: 8, op: rose_by, value: 0.8 }
        do: iceberg

  # 2 — Momentum trend: causal alpha + CVD drive + rising participation
  - when:
      all:
        - any:
            - { subject: regime, op: equals, regime: bullish }
            - { subject: regime, op: equals, regime: trending }
        - { subject: signal, category: endogenous_alpha, unit: snr, op: at_least, value: 1.2 }
        - { subject: signal, category: aggressive_drive, unit: snr, op: at_least, value: 1.0 }
        - any:
            - { subject: signal, category: laminar, unit: confidence, op: at_least, value: 0.55 }
            - { subject: signal, category: inertial, unit: confidence, op: at_least, value: 0.55 }
        - not: { subject: regime, op: equals, regime: choppy }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.45 }
        - not: { subject: signal, category: liquidity_vacuum, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: signal, category: liquidity_shock, unit: snr, op: above, value: 1.0 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: volume, unit: percentage, ago: 20, op: rose_by, value: 25.0 }
            - { subject: price, unit: percentage, ago: 15, op: rose_by, value: 1.0 }
        do: limit

  # 3 — Absorption accumulation: hidden bid + support → imbalance edge
  - when:
      all:
        - { subject: regime, op: equals, regime: bullish }
        - { subject: signal, category: hidden_absorption, unit: confidence, op: at_least, value: 0.65 }
        - { subject: signal, category: hard_support, unit: confidence, op: at_least, value: 0.55 }
        - any:
            - { subject: signal, category: robust_liquidity, unit: confidence, op: at_least, value: 0.5 }
            - { subject: signal, category: median_depth, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.4 }
        - not: { subject: signal, category: liquidity_vacuum, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: signal, category: spoof_trap, unit: confidence, op: at_least, value: 0.45 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: signal, category: loaded_imbalance, unit: snr, ago: 10, op: crossed_up, value: 1.0 }
        do: limit

  # 4 — Scarcity squeeze: thin book + coil → ignition
  - when:
      all:
        - { subject: signal, category: extreme_scarcity, unit: confidence, op: at_least, value: 0.55 }
        - any:
            - { subject: signal, category: coiled_compression, unit: confidence, op: at_least, value: 0.5 }
            - { subject: signal, category: organic_trend, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: regime, op: equals, regime: bearish }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.45 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: signal, category: vertical_ignition, unit: snr, ago: 5, op: crossed_up, value: 1.2 }
        do: iceberg

  # 5 — Lead-lag catch-up: inefficient lag + decoupled alpha in a broad move
  - when:
      all:
        - any:
            - { subject: regime, op: equals, regime: trending }
            - { subject: regime, op: equals, regime: bullish }
        - { subject: signal, category: inefficient_lag, unit: confidence, op: at_least, value: 0.55 }
        - { subject: signal, category: decoupled_alpha, unit: snr, op: at_least, value: 1.0 }
        - { subject: signal, category: synchronized_drift, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: signal, category: systemic_herd, unit: confidence, op: at_least, value: 0.65 }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.45 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: signal, category: decoupled_move, unit: snr, ago: 8, op: crossed_up, value: 1.0 }
        do: limit

  # 6 — Bearish breakdown short: structural slump / collapse
  - when:
      all:
        - { subject: regime, op: equals, regime: bearish }
        - not: { subject: regime, op: equals, regime: choppy }
        - not: { subject: signal, category: fragile_expansion, unit: confidence, op: at_least, value: 0.5 }
        - not: { subject: signal, category: toxic_bluff, unit: confidence, op: at_least, value: 0.45 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - any:
                - { subject: signal, category: systemic_slump, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
                - { subject: signal, category: mechanical_collapse, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
                - { subject: signal, category: divergent_stress, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
        do: { type: limit, side: sell }

  # 7 — Crowded-herd fade short: exhaustion of synchronized panic bid
  - when:
      all:
        - any:
            - { subject: regime, op: equals, regime: bearish }
            - { subject: regime, op: equals, regime: choppy }
        - { subject: signal, category: systemic_herd, unit: confidence, op: at_least, value: 0.6 }
        - any:
            - { subject: signal, category: saturation, unit: confidence, op: at_least, value: 0.55 }
            - { subject: signal, category: frenzy, unit: confidence, op: at_least, value: 0.55 }
        - not: { subject: signal, category: hard_support, unit: confidence, op: at_least, value: 0.6 }
    then:
      - when:
          all:
            - { subject: position, op: equals, lifecycle: not_holding }
            - { subject: signal, category: active_reversal, unit: snr, ago: 5, op: crossed_up, value: 1.0 }
        do: { type: limit, side: sell }
