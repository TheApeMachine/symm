branches:
  # --- exits: checked before any entry path ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: true
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: exhaustion
                  type: category
                  category:
                    type: mechanical_collapse
            - type: is_greater_than_or_equal
              left:
                  source: exhaustion
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: settle_position
          side: sell
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: exhaustion
                  type: category
                  category:
                    type: active_reversal
            - type: is_greater_than_or_equal
              left:
                  source: exhaustion
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: settle_position
          side: sell

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: true
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: hawkes
                  type: category
                  category:
                    type: saturation
            - type: is_greater_than_or_equal
              left:
                  source: hawkes
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: settle_position
          side: sell
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: fluid
                  type: category
                  category:
                    type: turbulent
            - type: is_greater_than_or_equal
              left:
                  source: fluid
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: settle_position
          side: sell

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: true
        - type: is_true
          left:
              source: causal
              type: category
              category:
                type: liquidity_shock
        - type: is_greater_than_or_equal
          left:
              source: causal
              type: confidence
          right:
              type: confidence
              confidence: exit_baseline
    action:
      type: settle_position
      side: sell

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: true
        - type: is_true
          left:
              source: manifold
              type: category
              category:
                type: liquidity_shock
        - type: is_greater_than_or_equal
          left:
              source: manifold
              type: confidence
          right:
              type: confidence
              confidence: exit_baseline
    action:
      type: settle_position
      side: sell

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: true
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: exhaustion
                  type: category
                  category:
                    type: thermal_exhaustion
            - type: is_greater_than_or_equal
              left:
                  source: exhaustion
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: take_profit
          side: sell
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: pumpdump
                  type: category
                  category:
                    type: faded_exhaustion
            - type: is_greater_than_or_equal
              left:
                  source: pumpdump
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: take_profit
          side: sell
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: causal
                  type: category
                  category:
                    type: systemic_beta
            - type: is_greater_than_or_equal
              left:
                  source: causal
                  type: confidence
              right:
                  type: confidence
                  confidence: exit_baseline
        action:
          type: take_profit
          side: sell

  # ====================================================================
  # ENTRIES
  #
  # Depth encodes TIME. Conditions inside one condition_group are matched
  # against the same window (co-occurrence). A nested child branch is matched
  # only against ticks STRICTLY AFTER the parent matched (logic/walk.go
  # sliceTimelineAfter), so nesting means "stage A fired, THEN stage B fired
  # after it". Sequencing depth is chosen per setup:
  #   - sequential setups (a trigger that PRECEDES a confirmation) nest 2 stages
  #   - state setups (a condition true right now) are a single flat group
  #
  # Guards are CROSS-SOURCE vetoes only (toxicity / liquidity / exhaustion /
  # depthflow spoof). A redundant `is_false <same source, other category>` is
  # never used: a source emits one category per tick, so is_true on one already
  # implies the others are false. Entries never fire on extreme_scarcity — a
  # book that thin cannot be exited.
  # ====================================================================

  # --- ignition: coiled compression, THEN vertical takeoff (sequential) ---
  # Stage 1 must persist across more than one observation. Stage 2 requires
  # pumpdump ignition plus a confirming tape signal (hawkes frenzy or CVD drive)
  # and explicit safety measurements from the guard sources.

  - condition_group:
      boolean: and
      min_observations: 2
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_greater_than_or_equal
          left:
              source: pumpdump
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: pumpdump
              type: category
              category:
                type: coiled_compression
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: pumpdump
                  type: category
                  category:
                    type: vertical_ignition
            - type: is_false
              left:
                  source: fluid
                  type: category
                  category:
                    type: turbulent
            - type: is_false
              left:
                  source: toxicity
                  type: category
                  category:
                    type: liquidity_vacuum
            - type: is_false
              left:
                  source: toxicity
                  type: category
                  category:
                    type: toxic_bluff
            - type: is_false
              left:
                  source: depthflow
                  type: category
                  category:
                    type: spoof_trap
            - type: is_false
              left:
                  source: liquidity
                  type: category
                  category:
                    type: extreme_scarcity
          groups:
            - boolean: or
              conditions:
                - type: is_true
                  left:
                      source: hawkes
                      type: category
                      category:
                        type: frenzy
                - type: is_true
                  left:
                      source: cvd
                      type: category
                      category:
                        type: aggressive_drive
        action:
          type: market
          side: buy

  # --- organic trend: breadth-backed drift is ON right now (state, flat) ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_greater_than_or_equal
          left:
              source: pumpdump
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: pumpdump
              type: category
              category:
                type: organic_trend
        - type: is_true
          left:
              source: sentiment
              type: category
              category:
                type: risk_on_surge
        - type: is_false
          left:
              source: exhaustion
              type: category
              category:
                type: mechanical_collapse
        - type: is_false
          left:
              source: liquidity
              type: category
              category:
                type: extreme_scarcity
    action:
      type: market
      side: buy

  # --- clean ignition: vertical takeoff is ON right now (state, flat) ---
  # This is the concurrent counterpart to the coil -> ignition sequence above.
  # It proposes a smaller candidate when structure is already breaking, a tape
  # confirmation agrees, and the explicit guard sources measured safe states.

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_true
          left:
              source: pumpdump
              type: category
              category:
                type: vertical_ignition
        - type: is_false
          left:
              source: exhaustion
              type: category
              category:
                type: mechanical_collapse
        - type: is_false
          left:
              source: toxicity
              type: category
              category:
                type: liquidity_vacuum
        - type: is_false
          left:
              source: toxicity
              type: category
              category:
                type: toxic_bluff
        - type: is_false
          left:
              source: depthflow
              type: category
              category:
                type: spoof_trap
        - type: is_false
          left:
              source: liquidity
              type: category
              category:
                type: extreme_scarcity
      groups:
        - boolean: or
          conditions:
            - type: is_true
              left:
                  source: hawkes
                  type: category
                  category:
                    type: frenzy
            - type: is_true
              left:
                  source: cvd
                  type: category
                  category:
                    type: aggressive_drive
    action:
      type: market
      side: buy

  # --- drive: aggressive flow with book backing right now (state, flat) ---

  - condition_group:
      boolean: and
      min_observations: 2
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        # Momentum must hold more than its even share of live mode energy —
        # a derived dominance line (1/active-modes), not a hardcoded 0.40.
        - type: is_greater_than_or_equal
          left:
              type: eigenmode
              eigenmode:
                mode: momentum
          right:
              type: eigenmode
              eigenmode:
                mode: momentum
                baseline: true
        - type: is_greater_than_or_equal
          left:
              source: cvd
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: cvd
              type: category
              category:
                type: aggressive_drive
        - type: is_false
          left:
              source: exhaustion
              type: category
              category:
                type: mechanical_collapse
        - type: is_false
          left:
              source: toxicity
              type: category
              category:
                type: toxic_bluff
        - type: is_false
          left:
              source: depthflow
              type: category
              category:
                type: spoof_trap
        - type: is_false
          left:
              source: liquidity
              type: category
              category:
                type: extreme_scarcity
    action:
      type: market
      side: buy

  # --- absorption breakout: hidden iceberg absorbed, THEN it breaks (sequential) ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_greater_than_or_equal
          left:
              source: cvd
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: cvd
              type: category
              category:
                type: hidden_absorption
        - type: is_true
          left:
              source: depthflow
              type: category
              category:
                type: loaded_imbalance
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: cvd
                  type: category
                  category:
                    type: aggressive_drive
            - type: is_false
              left:
                  source: exhaustion
                  type: category
                  category:
                    type: mechanical_collapse
            - type: is_false
              left:
                  source: toxicity
                  type: category
                  category:
                    type: toxic_bluff
            - type: is_false
              left:
                  source: depthflow
                  type: category
                  category:
                    type: spoof_trap
            - type: is_false
              left:
                  source: liquidity
                  type: category
                  category:
                    type: extreme_scarcity
        action:
          type: market
          side: buy

  # --- manifold herd: cross-section herd with correlation and risk-on breadth ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_greater_than_or_equal
          left:
              source: manifold
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: manifold
              type: category
              category:
                type: systemic_herd
        - type: is_true
          left:
              source: correlation
              type: category
              category:
                type: systemic_herd
        - type: is_true
          left:
              source: sentiment
              type: category
              category:
                type: risk_on_surge
        - type: is_false
          left:
              source: liquidity
              type: category
              category:
                type: extreme_scarcity
    action:
      type: market
      side: buy

  # --- catch-up: leader moves inefficiently ahead, THEN laggard drives (sequential) ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
              type: holding
              holding:
                held: false
        - type: is_greater_than_or_equal
          left:
              source: leadlag
              type: confidence
          right:
              type: confidence
              confidence: entry_baseline
        - type: is_true
          left:
              source: leadlag
              type: category
              category:
                type: inefficient_lag
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                  source: cvd
                  type: category
                  category:
                    type: aggressive_drive
            - type: is_false
              left:
                  source: exhaustion
                  type: category
                  category:
                    type: mechanical_collapse
            - type: is_false
              left:
                  source: toxicity
                  type: category
                  category:
                    type: toxic_bluff
            - type: is_false
              left:
                  source: liquidity
                  type: category
                  category:
                    type: extreme_scarcity
        action:
          type: market
          side: buy
