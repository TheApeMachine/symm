branches:
  # --- exits: checked before any entry path ---

  - condition_group:
      boolean: or
      conditions:
        - type: is_true
          left:
            subject:
              source: exhaust
              type: category
              category:
                type: mechanical_collapse
                confidence: 0.50
        - type: is_true
          left:
            subject:
              source: exhaust
              type: category
              category:
                type: active_reversal
                confidence: 0.50
    action:
      type: settle_position
      side: sell
      fraction: 1.0

  - condition_group:
      boolean: or
      conditions:
        - type: is_true
          left:
            subject:
              source: hawkes
              type: category
              category:
                type: saturation
                confidence: 0.50
        - type: is_true
          left:
            subject:
              source: fluid
              type: category
              category:
                type: turbulent
                confidence: 0.50
    action:
      type: settle_position
      side: sell
      fraction: 1.0

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
            subject:
              source: causal
              type: category
              category:
                type: liquidity_shock
                confidence: 0.50
    action:
      type: settle_position
      side: sell
      fraction: 1.0

  - condition_group:
      boolean: or
      conditions:
        - type: is_true
          left:
            subject:
              source: exhaust
              type: category
              category:
                type: thermal_exhaustion
                confidence: 0.50
        - type: is_true
          left:
            subject:
              source: pumpdump
              type: category
              category:
                type: faded_exhaustion
                confidence: 0.50
        - type: is_true
          left:
            subject:
              source: causal
              type: category
              category:
                type: systemic_beta
                confidence: 0.50
    action:
      type: take_profit
      side: sell
      fraction: 1.0

  # --- ignition: vertical pump / coiled compression ---

  - condition_group:
      boolean: or
      conditions:
        - type: is_true
          left:
            subject:
              source: pumpdump
              type: category
              category:
                type: vertical_ignition
                confidence: $confidence.regime_adjusted_baseline
                surprise: 1.0
        - type: is_true
          left:
            subject:
              source: pumpdump
              type: category
              category:
                type: coiled_compression
                confidence: $confidence.regime_adjusted_baseline
                surprise: 1.0
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                subject:
                  source: hawkes
                  type: category
                  category:
                    type: frenzy
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_false
              left:
                subject:
                  source: toxicity
                  type: category
                  category:
                    type: toxic_bluff
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_false
              left:
                subject:
                  source: depthflow
                  type: category
                  category:
                    type: spoof_trap
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_false
              left:
                subject:
                  source: fluid
                  type: category
                  category:
                    type: turbulent
                    confidence: $confidence.regime_adjusted_baseline
        branches:
          - condition_group:
              boolean: or
              conditions:
                - type: is_true
                  left:
                    subject:
                      source: causal
                      type: category
                      category:
                        type: endogenous_alpha
                        confidence: $confidence.regime_adjusted_baseline
                - type: is_true
                  left:
                    subject:
                      source: correlation
                      type: category
                      category:
                        type: decoupled_alpha
                        confidence: $confidence.regime_adjusted_baseline
            branches:
              - condition_group:
                  boolean: or
                  conditions:
                    - type: is_true
                      left:
                        subject:
                          source: cvd
                          type: category
                          category:
                            type: aggressive_drive
                            confidence: $confidence.regime_adjusted_baseline
                    - type: is_true
                      left:
                        subject:
                          source: depthflow
                          type: category
                          category:
                            type: loaded_imbalance
                            confidence: $confidence.regime_adjusted_baseline
                    - type: is_true
                      left:
                        subject:
                          source: toxicity
                          type: category
                          category:
                            type: hard_support
                            confidence: $confidence.regime_adjusted_baseline
                branches:
                  - condition_group:
                      boolean: or
                      conditions:
                        - type: is_true
                          left:
                            subject:
                              source: fluid
                              type: category
                              category:
                                type: laminar
                                confidence: $confidence.regime_adjusted_baseline
                        - type: is_true
                          left:
                            subject:
                              source: fluid
                              type: category
                              category:
                                type: inertial
                                confidence: $confidence.regime_adjusted_baseline
                    action:
                      type: market
                      side: buy
                      fraction: 0.25

  # --- catch-up: leader lag with local driver ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
            subject:
              source: leadlag
              type: category
              category:
                type: inefficient_lag
                confidence: $confidence.regime_adjusted_baseline
        - type: is_false
          left:
            subject:
              source: leadlag
              type: category
              category:
                type: anchor_stall
                confidence: $confidence.regime_adjusted_baseline
    branches:
      - condition_group:
          boolean: or
          conditions:
            - type: is_true
              left:
                subject:
                  source: causal
                  type: category
                  category:
                    type: endogenous_alpha
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_true
              left:
                subject:
                  source: correlation
                  type: category
                  category:
                    type: decoupled_alpha
                    confidence: $confidence.regime_adjusted_baseline
        branches:
          - condition_group:
              boolean: or
              conditions:
                - type: is_true
                  left:
                    subject:
                      source: sentiment
                      type: category
                      category:
                        type: risk_on_surge
                        confidence: $confidence.regime_adjusted_baseline
                - type: is_true
                  left:
                    subject:
                      source: sentiment
                      type: category
                      category:
                        type: divergent_move
                        confidence: $confidence.regime_adjusted_baseline
            branches:
              - condition_group:
                  boolean: or
                  conditions:
                    - type: is_true
                      left:
                        subject:
                          source: cvd
                          type: category
                          category:
                            type: aggressive_drive
                            confidence: $confidence.regime_adjusted_baseline
                    - type: is_true
                      left:
                        subject:
                          source: cvd
                          type: category
                          category:
                            type: hidden_absorption
                            confidence: $confidence.regime_adjusted_baseline
                branches:
                  - condition_group:
                      boolean: or
                      conditions:
                        - type: is_true
                          left:
                            subject:
                              source: hawkes
                              type: category
                              category:
                                type: frenzy
                                confidence: $confidence.regime_adjusted_baseline
                        - type: is_true
                          left:
                            subject:
                              source: hawkes
                              type: category
                              category:
                                type: organic
                                confidence: $confidence.regime_adjusted_baseline
                    branches:
                      - condition_group:
                          boolean: and
                          conditions:
                            - type: is_false
                              left:
                                subject:
                                  source: exhaust
                                  type: category
                                  category:
                                    type: mechanical_collapse
                                    confidence: 0.50
                        action:
                          type: market
                          side: buy
                          fraction: 0.20

  # --- organic trend: breadth-backed drift ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
            subject:
              source: pumpdump
              type: category
              category:
                type: organic_trend
                confidence: $confidence.regime_adjusted_baseline
        - type: is_false
          left:
            subject:
              source: sentiment
              type: category
              category:
                type: systemic_slump
                confidence: $confidence.regime_adjusted_baseline
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                subject:
                  source: cvd
                  type: category
                  category:
                    type: aggressive_drive
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_false
              left:
                subject:
                  source: causal
                  type: category
                  category:
                    type: systemic_beta
                    confidence: $confidence.regime_adjusted_baseline
        branches:
          - condition_group:
              boolean: or
              conditions:
                - type: is_true
                  left:
                    subject:
                      source: fluid
                      type: category
                      category:
                        type: laminar
                        confidence: $confidence.regime_adjusted_baseline
                - type: is_true
                  left:
                    subject:
                      source: hawkes
                      type: category
                      category:
                        type: organic
                        confidence: $confidence.regime_adjusted_baseline
            branches:
              - condition_group:
                  boolean: or
                  conditions:
                    - type: is_true
                      left:
                        subject:
                          source: sentiment
                          type: category
                          category:
                            type: risk_on_surge
                            confidence: $confidence.regime_adjusted_baseline
                    - type: is_true
                      left:
                        subject:
                          source: correlation
                          type: category
                          category:
                            type: synchronized_drift
                            confidence: $confidence.regime_adjusted_baseline
                action:
                  type: market
                  side: buy
                  fraction: 0.20

  # --- absorption breakout: iceberg exhausting into move ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
            subject:
              source: cvd
              type: category
              category:
                type: hidden_absorption
                confidence: $confidence.regime_adjusted_baseline
        - type: is_true
          left:
            subject:
              source: depthflow
              type: category
              category:
                type: loaded_imbalance
                confidence: $confidence.regime_adjusted_baseline
    branches:
      - condition_group:
          boolean: or
          conditions:
            - type: is_true
              left:
                subject:
                  source: pumpdump
                  type: category
                  category:
                    type: coiled_compression
                    confidence: $confidence.regime_adjusted_baseline
                    surprise: 1.0
            - type: is_true
              left:
                subject:
                  source: pumpdump
                  type: category
                  category:
                    type: vertical_ignition
                    confidence: $confidence.regime_adjusted_baseline
                    surprise: 1.0
        branches:
          - condition_group:
              boolean: and
              conditions:
                - type: is_true
                  left:
                    subject:
                      source: fluid
                      type: category
                      category:
                        type: inertial
                        confidence: $confidence.regime_adjusted_baseline
                - type: is_false
                  left:
                    subject:
                      source: toxicity
                      type: category
                      category:
                        type: toxic_bluff
                        confidence: $confidence.regime_adjusted_baseline
                - type: is_false
                  left:
                    subject:
                      source: depthflow
                      type: category
                      category:
                        type: spoof_trap
                        confidence: $confidence.regime_adjusted_baseline
            action:
              type: market
              side: buy
              fraction: 0.20

  # --- scarcity: thin market convexity ---

  - condition_group:
      boolean: and
      conditions:
        - type: is_true
          left:
            subject:
              source: liquidity
              type: category
              category:
                type: extreme_scarcity
                confidence: $confidence.regime_adjusted_baseline
        - type: is_true
          left:
            subject:
              source: pumpdump
              type: category
              category:
                type: coiled_compression
                confidence: $confidence.regime_adjusted_baseline
                surprise: 1.0
    branches:
      - condition_group:
          boolean: and
          conditions:
            - type: is_true
              left:
                subject:
                  source: hawkes
                  type: category
                  category:
                    type: frenzy
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_true
              left:
                subject:
                  source: causal
                  type: category
                  category:
                    type: endogenous_alpha
                    confidence: $confidence.regime_adjusted_baseline
            - type: is_false
              left:
                subject:
                  source: toxicity
                  type: category
                  category:
                    type: liquidity_vacuum
                    confidence: $confidence.regime_adjusted_baseline
        action:
          type: market
          side: buy
          fraction: 0.15
