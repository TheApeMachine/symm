# Hand-written setups — the manual workbench starting point.
#
#   make replay PLAYBOOK=setups.example.yaml
#
# Each named branch is one setup; every trade it produces is attributed to its
# name in the scoreboard. Edit thresholds, re-run, read. Notes that matter:
#   · signal SNR semantics: a tracker's usual category sits ≈0.5; ≥0.9 means
#     "top decile of surprise on this tape"; ≥4 is the p99 tail.
#   · `ago` counts distinct readings (≈20/sec on active symbols, so ago: 30 is
#     seconds); `within` is wall-clock BUT is bounded by the per-symbol ring
#     (story.measurements.buffer readings ≈ 1–2 minutes on active symbols).
#     Horizons beyond that need a deeper ring — raise the buffer before trusting
#     a 30m predicate.
#   · `then:` chains are sequences: the child is watched on the ticks AFTER the
#     parent held ("see compression, then ignition").
version: 2
branches:
    # Bullet 1: quick pump — compression loading, then ignition, enter the dip.
    # Unit choice is deliberate: SNR (surprise) triggers — new information;
    # CONFIDENCE (belief) confirms — the classifier actually means it. Surprise
    # without belief is noise; belief without surprise is boredom. Entries want
    # the conjunction.
    - name: quick_pump
      when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - subject: signal
              category: coiled_compression
              unit: snr
              op: at_least
              value: 0.9
      then:
            - when:
                all:
                    - subject: signal
                      category: vertical_ignition
                      unit: snr
                      op: at_least
                      value: 0.9
                    - subject: signal
                      category: vertical_ignition
                      unit: confidence
                      op: at_least
                      value: 0.45
                    - subject: price
                      unit: percentage
                      ago: 8
                      op: fell_by
                      value: 1
              do:
                type: market
                fraction: 0.5

    # Quick pump exits: leg is dead, or reversal pressure — settle immediately.
    # Exits prefer CONFIDENCE over surprise: you don't need exhaustion to be
    # novel to know it's confidently present — by the third exhausted tick its
    # SNR has already decayed toward the ~0.5 habitual floor, but its
    # confidence is still high. Surprise-gated exits go blind exactly when the
    # condition persists.
    - name: quick_pump_exit
      when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - any:
                - subject: signal
                  category: faded_exhaustion
                  unit: confidence
                  op: at_least
                  value: 0.6
                - subject: signal
                  category: active_reversal
                  unit: snr
                  op: at_least
                  value: 0.9
      do: settle_position

    # Bullet 2: slow pump — sustained drift with participation, ride a wide trail.
    # Here HABITUAL is what you want — an established trend, not a novel one —
    # so the gate is organic_trend CONFIDENCE (belief in a persistent state),
    # plus the REGIME subject: this setup is only awake in trending tape. The
    # regime gate is also what the slot allocator will read to decide which
    # setup class deserves reserved capacity.
    - name: slow_pump
      when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - subject: regime
              regime: trending
              op: equals
            - subject: price
              unit: percentage
              within: 60s
              op: rose_by
              value: 2
            - subject: volume
              unit: percentage
              within: 60s
              op: rose_by
              value: 10
            - subject: signal
              category: organic_trend
              unit: confidence
              op: at_least
              value: 0.6
      do:
        type: market
        fraction: 0.25

    # Bullet 3 (sketch): intraday dip-revert — flash drop without toxic flow.
    # Two more units doing real work: the toxicity VETO is confidence-based
    # (believed toxicity blocks the knife-catch whether or not it's novel), and
    # STRENGTH is the raw physical magnitude — liquidity's strength is depth
    # notional in EUR, so "strength ≥ 1000" literally means "at least ~€1k of
    # book to land on". (Scales are signal-specific: check the raw dumps.)
    - name: intraday_revert
      when:
        all:
            - subject: position
              lifecycle: not_holding
              op: equals
            - subject: price
              unit: percentage
              within: 30s
              op: fell_by
              value: 2
            - not:
                subject: signal
                category: toxic_bluff
                unit: confidence
                op: at_least
                value: 0.5
            - subject: signal
              category: robust_liquidity
              unit: strength
              op: at_least
              value: 1000
      do:
        type: market
        fraction: 0.25

    # Universal floor for fresh positions; trail once a move confirms.
    - name: protect_fresh
      when:
        all:
            - subject: position
              lifecycle: holding
              op: equals
            - subject: position
              lifecycle: has_started
              op: equals
      do:
        type: stop_loss
        offset: 0.012
    - name: trail_runner
      when:
        subject: position
        lifecycle: holding
        op: equals
      do:
        type: trailing_stop
        offset: 0.01
