name: measurement-boundaries

on:
  push:
    branches: [fix/sealed-measurement-boundaries]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact implementation source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/boundary-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-source
          path: ${{ runner.temp }}/boundary-source.tar.gz
          retention-days: 1
