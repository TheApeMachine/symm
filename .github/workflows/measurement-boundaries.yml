name: measurement-boundaries

on:
  push:
    branches: [fix/sealed-measurement-boundaries]

permissions:
  contents: read
  actions: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boundary-modules
          run-id: 36153945046
          github-token: ${{ github.token }}
          path: modules
      - name: Split dependency archive at transport size boundary
        run: split -b 350M -d modules/modules.tar.gz modules/part-
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-modules-0
          path: modules/part-00
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-modules-1
          path: modules/part-01
          retention-days: 1
