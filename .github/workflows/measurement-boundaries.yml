name: measurement-boundaries

on:
  push:
    branches: [fix/sealed-measurement-boundaries]

concurrency:
  group: measurement-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -ldflags=-checklinkname=0
    steps:
      - uses: actions/checkout@v4
        with:
          path: symm
      - uses: actions/checkout@v4
        with:
          repository: theapemachine/datura
          ref: v1.2.11
          path: datura
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: symm/go.mod
          cache-dependency-path: symm/go.sum
      - name: Install schema compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y capnproto
          go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.2
      - name: Apply source migration and regenerate schemas
        working-directory: symm
        run: |
          set -eu
          python3 scripts/prepare-boundary-pr.py
          include="$(go list -m -f '{{.Dir}}' capnproto.org/go/capnp/v3)/std"
          capnp compile -I "$include" -ogo nomagique/data/*.capnp
          capnp compile -I "$include" -ogo nomagique/store/*.capnp
          gofmt -w nomagique/data/measurement*.go nomagique/store/boundary*.go nomagique/store/grid*.go nomagique/compiler/schema.go
      - name: Run boundary and publication tests
        working-directory: symm
        run: go test -count=1 -p 1 -timeout 8m ./nomagique/data ./nomagique/store -run 'TestBoundary|TestMeasurement'
      - name: Regenerate node catalog
        working-directory: symm
        run: make catalog
      - name: Commit generated source on the isolated branch
        if: github.ref == 'refs/heads/fix/sealed-measurement-boundaries'
        working-directory: symm
        run: |
          set -eu
          git add nomagique/data nomagique/store nomagique/compiler/schema.go nomagique/compiler/factories_gen.go frontend/src/components/flume/flume-config.generated.ts
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: generate verified measurement boundary bindings and catalog'
            git push origin HEAD:fix/sealed-measurement-boundaries
          fi
