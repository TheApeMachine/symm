name: capnp-repair
on:
  push:
    branches: [repair/capnp-live-graph]
    paths:
      - .github/workflows/capnp-repair.yml
      - scripts/check-capnp-transport.mjs
      - scripts/check-capnp-frame.go
permissions:
  contents: read
  actions: read
concurrency:
  group: capnp-repair-probe
  cancel-in-progress: true
jobs:
  dependency-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover original baseline inputs
        uses: actions/download-artifact@v4
        with:
          name: capnp-repair-build-inputs
          run-id: 35492375774
          github-token: ${{ github.token }}
          path: repair-artifacts
      - name: Split build cache without changing project dependencies
        shell: bash
        run: |
          mkdir -p repair-parts
          split -b 250m repair-artifacts/go-modules.tar.gz repair-parts/modules-
          mv repair-artifacts/go-toolchain.tar.gz repair-parts/toolchain.tar.gz
          rm repair-artifacts/go-modules.tar.gz
      - name: Install pinned proposed TypeScript dependency
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/capnp-probe" repair-artifacts/dependency-probe
          npm install --prefix "$RUNNER_TEMP/capnp-probe" --ignore-scripts --no-audit --no-fund @naeemo/capnp@0.9.3
          tar -C "$RUNNER_TEMP/capnp-probe" -czf repair-artifacts/naeemo-runtime.tar.gz node_modules package-lock.json
      - name: Exercise actual library TCP framing
        shell: bash
        run: |
          cp scripts/check-capnp-transport.mjs "$RUNNER_TEMP/capnp-probe/probe.mjs"
          cd "$RUNNER_TEMP/capnp-probe"
          node probe.mjs "$GITHUB_WORKSPACE/repair-artifacts/dependency-probe"
      - name: Validate test messages independently with Go Capnp
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/go-capnp-probe"
          cd "$RUNNER_TEMP/go-capnp-probe"
          go mod init probe
          go get capnproto.org/go/capnp/v3@v3.1.0-alpha.2
          cp "$GITHUB_WORKSPACE/scripts/check-capnp-frame.go" main.go
          go run . "$GITHUB_WORKSPACE/repair-artifacts/dependency-probe" | tee "$GITHUB_WORKSPACE/repair-artifacts/dependency-probe/go-frames.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-source-evidence
          path: repair-artifacts/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-toolchain
          path: repair-parts/toolchain.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-modules-a
          path: repair-parts/modules-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-modules-b
          path: repair-parts/modules-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-modules-c
          path: repair-parts/modules-ac
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capnp-modules-d
          path: repair-parts/modules-ad
          retention-days: 1
          compression-level: 0
