name: capnp-dependency-check
on:
  push:
    branches: [repair/capnp-live-graph]
    paths:
      - .github/workflows/capnp-repair.yml
      - scripts/check-capnp-transport.mjs
      - scripts/check-capnp-frame.go
permissions:
  contents: read
concurrency:
  group: capnp-repair-probe
  cancel-in-progress: true
jobs:
  dependency-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare exact dependency versions without changing SYMM
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/capnp-probe" "$RUNNER_TEMP/go-capnp-probe" repair-artifacts
          npm install --prefix "$RUNNER_TEMP/capnp-probe" --ignore-scripts --no-audit --no-fund @naeemo/capnp@0.9.3
          cp scripts/check-capnp-transport.mjs "$RUNNER_TEMP/capnp-probe/probe.mjs"
          cp scripts/check-capnp-frame.go "$RUNNER_TEMP/go-capnp-probe/main.go"
          cp "$RUNNER_TEMP/capnp-probe/package-lock.json" repair-artifacts/npm-lock.json
          cd "$RUNNER_TEMP/go-capnp-probe"
          go mod init probe
          go get capnproto.org/go/capnp/v3@v3.1.0-alpha.2
          go build -o "$RUNNER_TEMP/check-capnp-frame" main.go
          "$RUNNER_TEMP/check-capnp-frame" --write "$GITHUB_WORKSPACE/repair-artifacts"
      - name: Exercise installed TypeScript dependency and native Go fixture
        shell: bash
        run: |
          cd "$RUNNER_TEMP/capnp-probe"
          node probe.mjs "$GITHUB_WORKSPACE/repair-artifacts" 2>&1 | tee "$GITHUB_WORKSPACE/repair-artifacts/typescript-log.txt"
      - name: Independently decode all fixtures with Go Capnp
        if: always()
        shell: bash
        run: |
          "$RUNNER_TEMP/check-capnp-frame" "$GITHUB_WORKSPACE/repair-artifacts" 2>&1 | tee "$GITHUB_WORKSPACE/repair-artifacts/go-log.txt"
      - name: Preserve wire fixtures and actual assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capnp-interop-results
          path: repair-artifacts/
          retention-days: 7
