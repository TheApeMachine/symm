name: capnp-repair
on:
  push:
    branches: [repair/capnp-live-graph]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install schema compiler
        run: sudo apt-get update -qq && sudo apt-get install -y capnproto libcapnp-dev
      - name: Capture unmodified build and dependencies
        shell: bash
        run: |
          mkdir -p repair-artifacts
          go version | tee repair-artifacts/toolchain.txt
          capnp --version | tee -a repair-artifacts/toolchain.txt
          set +e
          timeout 240 go mod download >repair-artifacts/module-download.txt 2>&1
          echo $? >repair-artifacts/module-download.exit
          timeout 120 go test ./nomagique/compiler ./nomagique/store ./nomagique/cognition ./cmd >repair-artifacts/baseline-test.txt 2>&1
          echo $? >repair-artifacts/baseline-test.exit
          set -e
          GOBIN="$PWD/repair-artifacts/bin" go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.2
          cp /usr/bin/capnp /usr/bin/capnpc-c++ repair-artifacts/bin/
          mkdir -p repair-artifacts/lib repair-artifacts/include
          cp -a /usr/lib/x86_64-linux-gnu/libcapnp*.so* /usr/lib/x86_64-linux-gnu/libkj*.so* repair-artifacts/lib/
          cp -a /usr/include/capnp repair-artifacts/include/
          git archive HEAD | gzip >repair-artifacts/current-source.tar.gz
          git archive 42be41f15833ca1a410a7e84259d1abe46533706 signal nomagique logic | gzip >repair-artifacts/historical-source.tar.gz
          tar -C "$(go env GOROOT)/.." -czf repair-artifacts/go-toolchain.tar.gz "$(basename "$(go env GOROOT)")"
          tar -C "$(go env GOPATH)/pkg" -czf repair-artifacts/go-modules.tar.gz mod
      - name: Upload build evidence and build inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capnp-repair-build-inputs
          path: repair-artifacts/
          retention-days: 1
          compression-level: 0
